<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YURI Circuitry — die view (entire system)</title>
<style>
  :root{ --bg:#05070d; --ink:#eaf1ff; --muted:#7e93ba; --line:#1a2740; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(120% 120% at 50% 35%,#0a1020,#05070d 70%);color:var(--ink);overflow:hidden;
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  svg{display:block}
  #title{position:fixed;top:16px;left:18px;z-index:10}
  #title b{font-size:15px} #title .s{color:var(--muted);font-size:11px;margin-top:2px}
  #legend{position:fixed;top:16px;right:18px;z-index:10;max-width:230px;
    background:#0b1220aa;border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px)}
  #legend h4{margin:0 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:650}
  .lg{display:flex;align-items:center;gap:7px;padding:2px 0;font-size:11.5px;cursor:default}
  .lg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .lg .ct{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  #hint{position:fixed;bottom:14px;left:18px;z-index:10;color:var(--muted);font-size:10.5px;max-width:360px;line-height:1.5}
  #focus{position:fixed;bottom:14px;right:18px;z-index:10;color:var(--ink);font-size:12px;text-align:right;min-height:32px}
  #focus .fl{color:var(--muted);font-size:10.5px}
  .node text{font-size:7.5px;fill:var(--muted);cursor:pointer;transition:fill .12s}
  .node.hi text{fill:#fff;font-weight:600}
  .link{fill:none;stroke-opacity:.42;transition:stroke-opacity .12s,stroke .12s}
  .link.fade{stroke-opacity:.04}
  .link.out{stroke:#ff6b6b;stroke-opacity:.95}
  .link.inc{stroke:#4dd2ff;stroke-opacity:.95}
</style>
</head>
<body>
<div id="title"><b>YURI Circuitry — Die View</b><div class="s">the entire system · 242 nodes · hierarchical edge bundling · grouped by layer</div></div>
<div id="legend"><h4>Layers</h4><div id="legendItems"></div></div>
<div id="hint">Hover a node → <span style="color:#ff6b6b">outgoing</span> / <span style="color:#4dd2ff">incoming</span> wiring lights up. Each node is a real YURI organ; each arc a real call/read/write.</div>
<div id="focus"></div>
<div id="wrap"><svg id="svg"></svg></div>

<!-- real merged graph (window.GRAPH), generated from yuri-die-graph.json -->
<script src="data/circuitry-graph.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
(function(){
  const G = window.GRAPH;
  if (!G || !window.d3) { document.getElementById('wrap').innerHTML='<div style="color:#f66">circuitry-graph.js or d3 failed to load — run: node demos/build/gen-circuitry-data.mjs</div>'; return; }
  const d3 = window.d3;

  const side = Math.min(innerWidth, innerHeight) * 0.94;
  const radius = side/2 - 124;        // leave room for labels
  const svg = d3.select('#svg').attr('width', side).attr('height', side)
    .append('g').attr('transform', `translate(${side/2},${side/2})`);

  // ---- hierarchy: root → layer → node ----
  const byGroup = new Map(G.groups.map(grp => [grp, []]));
  for (const n of G.nodes) (byGroup.get(n.group) || byGroup.set(n.group,[]).get(n.group)).push(n);
  const rootData = { name:'root', children: G.groups.map(grp => ({
    name: grp, children: byGroup.get(grp).map(n => ({ name:n.id, node:n })) })) };

  const root = d3.hierarchy(rootData);
  d3.cluster().size([2*Math.PI, radius])(root);
  const leaves = root.leaves();
  const idToLeaf = new Map(leaves.map(l => [l.data.name, l]));

  // ---- links (bundled) ----
  const line = d3.lineRadial().curve(d3.curveBundle.beta(0.85)).radius(d => d.y).angle(d => d.x);
  const linkData = [];
  for (const e of G.edges) {
    const a = idToLeaf.get(e.source), b = idToLeaf.get(e.target);
    if (a && b) linkData.push({ source:e.source, target:e.target, type:e.type, path:a.path(b) });
  }
  const color = grp => G.groupColor[grp] || '#8aa0c6';

  const linkSel = svg.append('g').selectAll('path').data(linkData).join('path')
    .attr('class','link')
    .attr('d', d => line(d.path))
    .attr('stroke', d => color(idToLeaf.get(d.source).parent.data.name));

  // ---- nodes (dot + label on the ring) ----
  const nodeSel = svg.append('g').selectAll('g').data(leaves).join('g')
    .attr('class','node')
    .attr('transform', d => `rotate(${d.x*180/Math.PI - 90}) translate(${d.y},0)`);
  nodeSel.append('circle')
    .attr('r', d => d.data.node.kind === 'die' ? 2.6 : 1.7)
    .attr('fill', d => color(d.parent.data.name))
    .attr('fill-opacity', d => d.data.node.kind === 'die' ? 1 : 0.55);
  nodeSel.append('text')
    .attr('dy','0.31em')
    .attr('x', d => d.x < Math.PI ? 6 : -6)
    .attr('text-anchor', d => d.x < Math.PI ? 'start' : 'end')
    .attr('transform', d => d.x >= Math.PI ? 'rotate(180)' : null)
    .text(d => d.data.node.label.length > 22 ? d.data.node.label.slice(0,21)+'…' : d.data.node.label);

  // ---- interaction ----
  const incident = new Map();  // id -> {out:[linkIdx], inc:[linkIdx]}
  linkData.forEach((l,i)=>{
    (incident.get(l.source) || incident.set(l.source,{out:[],inc:[]}).get(l.source)).out.push(i);
    (incident.get(l.target) || incident.set(l.target,{out:[],inc:[]}).get(l.target)).inc.push(i);
  });
  const focus = document.getElementById('focus');
  function over(_,leaf){
    const id = leaf.data.name, info = incident.get(id) || {out:[],inc:[]};
    const outSet = new Set(info.out), incSet = new Set(info.inc);
    const touched = new Set([id]);
    info.out.forEach(i=>touched.add(linkData[i].target));
    info.inc.forEach(i=>touched.add(linkData[i].source));
    linkSel.attr('class', (d,i)=> outSet.has(i)?'link out':incSet.has(i)?'link inc':'link fade');
    linkSel.filter((d,i)=>outSet.has(i)||incSet.has(i)).raise();
    nodeSel.classed('hi', d=>touched.has(d.data.name));
    const n = leaf.data.node;
    focus.innerHTML = `<div class="fl">${n.group} · ${n.kind}</div><b>${n.label}</b><div class="fl">${info.out.length} out · ${info.inc.length} in</div>`;
  }
  function out(){ linkSel.attr('class','link'); nodeSel.classed('hi',false); focus.innerHTML=''; }
  nodeSel.on('mouseover', over).on('mouseout', out);

  // ---- legend ----
  const counts = {}; G.nodes.forEach(n=>counts[n.group]=(counts[n.group]||0)+1);
  document.getElementById('legendItems').innerHTML = G.groups.map(grp =>
    `<div class="lg"><span class="sw" style="background:${color(grp)}"></span>${grp}<span class="ct">${counts[grp]}</span></div>`).join('');
})();
</script>
</body>
</html>
