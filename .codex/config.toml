#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "untrusted"
sandbox_mode = "workspace-write"

# Codex discovers the generated repository projection at `.agents/skills/`.
# Canonical bodies remain in governed roots and are never duplicated here.
# Generated `agents/openai.yaml` sidecars are the sole invocation authority for
# all 464 governed adapters (one implicit meta-router, 463 explicit-only).
# Codex 0.144.5 ignores project-layer `skills.config` filters, so the separate
# 14-path native-collision state can be reconciled through the official
# `skills/config/write` API with zero config reads. It never targets `.agents`.

[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 1
max_depth = 1

[features]
enable_fanout = false
multi_agent = false

[mcp_servers.yuriOffload]
command = "node"
args = [".codex/adapters/yuri-offload-mcp.mjs"]
enabled = false
startup_timeout_sec = 5
# Long offload jobs can legitimately spend minutes reasoning before returning text.
# Keep this effectively out of the way so lane-level budgets own cancellation.
tool_timeout_sec = 21600

[mcp_servers.october]
command = "sh"
args = ["-c", 'exec node "$(git rev-parse --show-toplevel)/_SYSTEM/Scripts/october-mcp-stdio-bridge.mjs"']
env_vars = ["OCTOBER_BUS_PORT", "OCTOBER_BUS_CANVAS", "OCTOBER_BUS_NODE"]
enabled = true
startup_timeout_sec = 10
tool_timeout_sec = 130

[mcp_servers.gitnexus]
command = "node"
args = ["_SYSTEM/Scripts/gitnexus-mcp.mjs"]
enabled = true
startup_timeout_sec = 10
tool_timeout_sec = 180

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
enabled = true
startup_timeout_sec = 15
tool_timeout_sec = 60

[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/_SYSTEM/Scripts/yuri-hook-adapter.mjs\" --harness codex"
timeout = 10
statusMessage = "Applying YURI policy"
