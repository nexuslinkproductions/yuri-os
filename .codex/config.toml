approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 1
max_depth = 1

[features]
enable_fanout = false
multi_agent = false

[mcp_servers.yuriOffload]
command = "node"
args = [".codex/adapters/yuri-offload-mcp.mjs"]
enabled = false
startup_timeout_sec = 5
tool_timeout_sec = 21600

[mcp_servers.october]
command = "sh"
args = [
    "-c",
    'exec node "$(git rev-parse --show-toplevel)/_SYSTEM/Scripts/october-mcp-stdio-bridge.mjs"',
]
env_vars = [
    "OCTOBER_BUS_PORT",
    "OCTOBER_BUS_CANVAS",
    "OCTOBER_BUS_NODE",
]
enabled = true
startup_timeout_sec = 10
tool_timeout_sec = 130

[mcp_servers.gitnexus]
command = "node"
args = ["_SYSTEM/Scripts/gitnexus-mcp.mjs"]
enabled = true
startup_timeout_sec = 10
tool_timeout_sec = 180

[mcp_servers.github]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-github",
]
enabled = true
startup_timeout_sec = 15
tool_timeout_sec = 60

[mcp_servers.october-bus]
url = "http://127.0.0.1:51713/mcp"

[mcp_servers.october-bus.env_http_headers]
X-October-Canvas = "OCTOBER_BUS_CANVAS"
X-October-Node = "OCTOBER_BUS_NODE"

[mcp_servers.october-bus.tools.message_peer]
approval_mode = "approve"

[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "root=\"$(git rev-parse --show-toplevel 2>/dev/null || git -C \"${YURI_WORKTREE_ROOT:-$HOME/YURI-OS-MUSUBI}\" rev-parse --show-toplevel 2>/dev/null || printf \"%s\" \"${YURI_WORKTREE_ROOT:-$HOME/YURI-OS-MUSUBI}\")\"; exec node \"$root/_SYSTEM/Scripts/yuri-hook-adapter.mjs\" --harness codex"
timeout = 10
statusMessage = "Applying YURI policy"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_BASH_NO_TIMEOUT = "1"
YURI_WORKHORSE_TIMEOUT = "0"
YURI_ENERGY_OBSERVABILITY = "1"
API_TIMEOUT_MS = "3000000"
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
