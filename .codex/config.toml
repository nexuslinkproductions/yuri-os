#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "untrusted"
sandbox_mode = "workspace-write"

# Keep the skill surface focused in this workspace.
# Large research / sandbox trees create noisy sessions and skill-list overflow.

[[skills.config]]
path = "skills"
enabled = true

[[skills.config]]
path = "03_RESOURCES/RESEARCH/ruflo"
enabled = false

[[skills.config]]
path = "01_PROJECTS/superpowers"
enabled = false

[[skills.config]]
path = "01_PROJECTS/claude-cookbooks"
enabled = false

[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 1
max_depth = 1

[features]
enable_fanout = false
multi_agent = false

[mcp_servers.yuriOffload]
command = "node"
args = [".codex/adapters/yuri-offload-mcp.mjs"]
enabled = false
startup_timeout_sec = 5
# Long offload jobs can legitimately spend minutes reasoning before returning text.
# Keep this effectively out of the way so lane-level budgets own cancellation.
tool_timeout_sec = 21600

[mcp_servers.gitnexus]
command = "node"
args = ["_SYSTEM/Scripts/gitnexus-mcp.mjs"]
enabled = true
startup_timeout_sec = 10
tool_timeout_sec = 180

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
enabled = true
startup_timeout_sec = 15
tool_timeout_sec = 60

[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/_SYSTEM/Scripts/yuri-hook-adapter.mjs\" --harness codex"
timeout = 10
statusMessage = "Applying YURI policy"
