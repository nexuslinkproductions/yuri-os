#:schema https://developers.openai.com/codex/config-schema.json

# Keep the skill surface focused in this workspace.
# Large research / sandbox trees create noisy sessions and skill-list overflow.

[[skills.config]]
path = "/Users/marcelspatz/YURI/RESEARCH/ruflo"
enabled = false

[[skills.config]]
path = "/Users/marcelspatz/YURI/01_PROJECTS/openspace"
enabled = false

[[skills.config]]
path = "/Users/marcelspatz/YURI/01_PROJECTS/superpowers"
enabled = false

[[skills.config]]
path = "/Users/marcelspatz/YURI/01_PROJECTS/claude-cookbooks"
enabled = false

[[skills.config]]
path = "/Users/marcelspatz/YURI/.claude/skills/deepseek-workhorse"
enabled = true
name = "deepseek-workhorse"

sandbox_mode = "danger-full-access"
[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 1
max_depth = 1

[features]
enable_fanout = false
multi_agent = false

[mcp_servers.yuriOffload]
command = "node"
args = ["/Users/marcelspatz/YURI/.codex/adapters/yuri-offload-mcp.mjs"]
enabled = true
startup_timeout_sec = 5
# Long offload jobs can legitimately spend minutes reasoning before returning text.
# Keep this effectively out of the way so lane-level budgets own cancellation.
tool_timeout_sec = 21600

[mcp_servers.gitnexus]
command = "node"
args = ["/Users/marcelspatz/YURI/Scripts/gitnexus-mcp.mjs"]
enabled = true
startup_timeout_sec = 10
tool_timeout_sec = 180

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
enabled = true
startup_timeout_sec = 15
tool_timeout_sec = 60

[[hooks.PreToolUse]]
matcher = "*"
hooks = [{ type = "command", command = "node /Users/marcelspatz/YURI/.codex/hooks/pre-tool-use.mjs" }]
