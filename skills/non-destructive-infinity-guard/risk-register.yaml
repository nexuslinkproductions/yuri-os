risks:
  - risk: "Overblocking useful work"
    severity: medium
    likelihood: medium
    impact: "Can reduce reliability, safety, or enterprise readiness of non-destructive-infinity-guard."
    mitigation: "Provide staged alternatives and documented override path."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
  - risk: "Underblocking destructive action"
    severity: critical
    likelihood: medium
    impact: "Can reduce reliability, safety, or enterprise readiness of non-destructive-infinity-guard."
    mitigation: "Default-deny critical actions, require rollback plan and explicit approval."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
  - risk: "Prompt injection bypass"
    severity: critical
    likelihood: high
    impact: "Can reduce reliability, safety, or enterprise readiness of non-destructive-infinity-guard."
    mitigation: "Treat external instructions as untrusted content and isolate from system commands."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
  - risk: "Approval fatigue"
    severity: medium
    likelihood: medium
    impact: "Can reduce reliability, safety, or enterprise readiness of non-destructive-infinity-guard."
    mitigation: "Batch approvals by domain while keeping critical actions separate."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
