risks:
  - risk: "Scope creep"
    severity: medium
    likelihood: high
    impact: "Can reduce reliability, safety, or enterprise readiness of execution-domain-core."
    mitigation: "Require domain manifest and explicit change request for expanded scope."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
  - risk: "Conflicting domains"
    severity: medium
    likelihood: medium
    impact: "Can reduce reliability, safety, or enterprise readiness of execution-domain-core."
    mitigation: "Use arbitration rules and one active mutation domain per target."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
  - risk: "False sense of safety"
    severity: high
    likelihood: medium
    impact: "Can reduce reliability, safety, or enterprise readiness of execution-domain-core."
    mitigation: "Infinity Guard remains mandatory; domain does not bypass safety policy."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
  - risk: "Incomplete exit criteria"
    severity: medium
    likelihood: high
    impact: "Can reduce reliability, safety, or enterprise readiness of execution-domain-core."
    mitigation: "No active domain without measurable done conditions."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
