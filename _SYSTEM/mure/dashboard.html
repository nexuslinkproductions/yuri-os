<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS LINK — agentic company</title>
<style>
/* ── NEXUS design tokens (continued from 03_NEXUS-LINK/nexus-app/ui/styles.css) ── */
:root,[data-theme="dark"]{
  --c-cyan:#00c8f0;--c-ice:#9df2ff;--c-violet:#8b5cf6;--c-green:#46e3c2;--c-amber:#f0a030;--c-vermillion:#e8453a;
  --bg-base:#04070f;--bg-subtle:#070b16;--bg-raised:#0c1220;--bg-overlay:#111927;--bg-float:#182032;--bg-peak:#1f2a40;
  --tx-primary:#e8f2fc;--tx-secondary:#a8bdd6;--tx-muted:#6e87a3;--tx-faint:#42546b;--tx-inverse:#04070f;
  --surf-1:var(--bg-raised);--surf-2:var(--bg-overlay);--surf-3:var(--bg-float);--surf-4:var(--bg-peak);
  --border-faint:rgba(168,189,214,.06);--border-subtle:rgba(168,189,214,.10);--border-default:rgba(168,189,214,.16);--border-strong:rgba(168,189,214,.28);--border-accent:rgba(0,200,240,.35);
  --hl-top:rgba(255,255,255,.055);--sh-ambient:rgba(0,0,0,.55);--sh-key:rgba(0,0,0,.40);--sh-contact:rgba(0,0,0,.70);
  --grid-dot:rgba(168,189,214,.06);--track:rgba(232,242,252,.05);color-scheme:dark;
}
[data-theme="light"]{
  --c-cyan:#0098c0;--c-ice:#006e94;--c-violet:#6d3fd6;--c-green:#0f9e80;--c-amber:#b9740d;--c-vermillion:#c7291e;
  --bg-base:#eef2f8;--bg-subtle:#e7ecf3;--bg-raised:#fff;--bg-overlay:#f6f8fc;--bg-float:#fff;--bg-peak:#fff;
  --tx-primary:#0e1a2b;--tx-secondary:#2e4560;--tx-muted:#546e8a;--tx-faint:#8099b4;--tx-inverse:#f4f8fd;
  --surf-1:#fff;--surf-2:#f6f8fc;--surf-3:#fff;--surf-4:#fff;
  --border-faint:rgba(14,26,43,.06);--border-subtle:rgba(14,26,43,.10);--border-default:rgba(14,26,43,.15);--border-strong:rgba(14,26,43,.26);--border-accent:rgba(0,152,192,.40);
  --hl-top:rgba(255,255,255,.9);--sh-ambient:rgba(14,26,43,.06);--sh-key:rgba(14,26,43,.10);--sh-contact:rgba(14,26,43,.16);
  --grid-dot:rgba(14,26,43,.06);--track:rgba(14,26,43,.05);color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;font-weight:300;font-size:14px;
  color:var(--tx-primary);background:var(--bg-base);-webkit-font-smoothing:antialiased;line-height:1.55;letter-spacing:.01em;min-height:100vh;
  transition:background .32s,color .32s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7;
  background:radial-gradient(900px 600px at 82% -8%,color-mix(in srgb,var(--c-cyan) 9%,transparent),transparent 60%),
            radial-gradient(700px 520px at -10% 30%,color-mix(in srgb,var(--c-violet) 6%,transparent),transparent 55%)}
.label{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--tx-muted)}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace}
::selection{background:color-mix(in srgb,var(--c-cyan) 30%,transparent)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:99px;border:3px solid transparent;background-clip:content-box}

/* topbar */
.top{display:flex;align-items:center;gap:20px;height:62px;padding:0 28px;border-bottom:1px solid var(--border-subtle);
  background:color-mix(in srgb,var(--bg-base) 70%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:30px;height:30px;flex:none}
.brand .bt{font-weight:100;font-size:17px;letter-spacing:.16em;white-space:nowrap}
.brand .bt b{color:var(--c-cyan);font-weight:300}
.brand .bs{font-family:"SF Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx-faint);margin-top:2px}
.top .spacer{flex:1}
.statuspill{display:inline-flex;align-items:center;gap:7px;font-family:"SF Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 12px;border-radius:99px;border:1px solid}
.statuspill.armed{color:var(--c-vermillion);border-color:color-mix(in srgb,var(--c-vermillion) 45%,transparent);background:color-mix(in srgb,var(--c-vermillion) 10%,transparent)}
.statuspill.disarmed{color:var(--tx-muted);border-color:var(--border-default);background:transparent}
.statuspill .sd{width:7px;height:7px;border-radius:50%;background:currentColor}
.statuspill.armed .sd{animation:pulse 1.8s ease-in-out infinite}
.live{display:inline-flex;align-items:center;gap:7px;font-family:"SF Mono",monospace;font-size:11px;color:var(--tx-muted)}
.live .ld{width:7px;height:7px;border-radius:50%;background:var(--c-green);animation:ring 2.4s ease-out infinite}
.tog{display:inline-flex;background:var(--surf-2);border:1px solid var(--border-subtle);border-radius:99px;padding:3px}
.tog button{padding:4px 11px;border:none;background:none;cursor:pointer;border-radius:99px;font-size:11px;color:var(--tx-muted);font-family:inherit}
.tog button.on{background:var(--surf-4);color:var(--tx-primary);box-shadow:0 1px 4px var(--sh-key)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c-green) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

.wrap{max-width:1640px;margin:0 auto;padding:24px 28px 48px}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap>*{animation:viewIn .42s cubic-bezier(.22,1,.36,1) both}

/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:20px}
@media(max-width:1280px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surf-2);border:1px solid var(--border-default);border-radius:12px;padding:18px 18px 16px;position:relative;overflow:hidden;
  box-shadow:0 1px 3px var(--sh-key),0 6px 18px var(--sh-ambient),inset 0 1px 0 var(--hl-top)}
.kpi::after{content:"";position:absolute;top:0;left:0;width:22px;height:2px;background:var(--ac,var(--c-cyan));border-radius:0 0 2px 0}
.kpi .v{font-weight:200;font-size:32px;line-height:1.05;margin-top:11px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--tx-muted);font-weight:300}
.kpi .sub{font-family:"SF Mono",monospace;font-size:10px;color:var(--tx-faint);margin-top:7px;letter-spacing:.04em}

/* layout */
.stage{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:stretch;margin-bottom:18px}
@media(max-width:1180px){.stage{grid-template-columns:1fr}}
.lower{display:grid;grid-template-columns:1fr 420px;gap:18px}
@media(max-width:1180px){.lower{grid-template-columns:1fr}}
.panel{background:var(--surf-2);border:1px solid var(--border-default);border-radius:16px;padding:20px;
  box-shadow:0 1px 3px var(--sh-key),0 8px 24px var(--sh-ambient),inset 0 1px 0 var(--hl-top);position:relative}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.panel-h .pt{font-size:15px;font-weight:300}
.panel-h .pc{font-family:"SF Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-faint)}

/* ── radial constellation ── */
.constellation{display:flex;flex-direction:column}
.cwrap{position:relative;flex:1;min-height:560px;display:grid;place-items:center;
  background:radial-gradient(circle,var(--grid-dot) 1px,transparent 1px);background-size:26px 26px;border-radius:12px;overflow:hidden}
#cstar{width:100%;height:100%;max-height:620px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;padding-top:14px;border-top:1px solid var(--border-faint)}
.legend .li{display:inline-flex;align-items:center;gap:7px;font-family:"SF Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-muted)}
.legend .lg{width:9px;height:9px;border-radius:50%}
.cnode{cursor:pointer}
.cnode circle.core{transition:r .3s cubic-bezier(.34,1.36,.64,1),fill .3s}
.cnode:hover circle.core{r:13}
.cnode text{font-family:-apple-system,system-ui,sans-serif;font-size:10.5px;font-weight:400;fill:var(--tx-secondary);transition:fill .2s}
.cnode:hover text{fill:var(--tx-primary)}
.cnode.active circle.core{filter:url(#glow)}
.clink{stroke:var(--border-default);stroke-width:1;fill:none;opacity:.5;transition:opacity .3s,stroke .3s}
.clink.energized{stroke:color-mix(in srgb,var(--c-cyan) 60%,transparent);opacity:.9;stroke-dasharray:3 5;animation:flow 1.1s linear infinite}
.cnode.dim,.clink.dim{opacity:.12}
@keyframes flow{to{stroke-dashoffset:-16}}
.glabel{font-family:"SF Mono",monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;fill:var(--tx-faint)}
.garc{fill:none;stroke-width:1;opacity:.35}
.hub-ring{fill:none;stroke:var(--c-cyan)}
.pulsering{animation:hubpulse 3.4s ease-out infinite}
@keyframes hubpulse{0%{r:42px;opacity:.5}100%{r:150px;opacity:0}}
.rot{transform-origin:320px 320px;animation:spin 160s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.rot,.pulsering,.clink.energized,.statuspill .sd,.live .ld{animation:none}}

/* ── runs convergence stream ── */
.runs{display:flex;flex-direction:column;max-height:600px}
.runstream{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-right:4px;flex:1}
.run{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:10px;
  background:var(--surf-1);border:1px solid var(--border-subtle);border-left:2px solid var(--rc,var(--c-cyan));
  box-shadow:inset 0 1px 0 var(--hl-top);transition:transform .14s,border-color .14s;animation:viewIn .4s ease both}
.run:hover{transform:translateX(2px)}
.run .gauge{width:46px;height:46px}
.run .rmid{min-width:0}
.run .rid{font-family:"SF Mono",monospace;font-size:11px;color:var(--tx-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run .rmeta{font-family:"SF Mono",monospace;font-size:10px;color:var(--tx-faint);margin-top:3px}
.run .rchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rchip{font-family:"SF Mono",monospace;font-size:9px;letter-spacing:.04em;color:var(--tx-muted);background:color-mix(in srgb,var(--tx-muted) 12%,transparent);border-radius:99px;padding:2px 7px}
.run .rstat{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:"SF Mono",monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.pill .pd{width:6px;height:6px;border-radius:50%}
.pill.ok{color:var(--c-green);background:color-mix(in srgb,var(--c-green) 13%,transparent)}
.pill.ok .pd{background:var(--c-green)}
.pill.run{color:var(--c-amber);background:color-mix(in srgb,var(--c-amber) 13%,transparent)}
.pill.run .pd{background:var(--c-amber);animation:pulse 1.4s infinite}
.pill.forced{color:var(--tx-muted);background:color-mix(in srgb,var(--tx-muted) 13%,transparent)}
.pill.forced .pd{background:var(--tx-muted)}
.pill.err{color:var(--c-vermillion);background:color-mix(in srgb,var(--c-vermillion) 13%,transparent)}
.pill.err .pd{background:var(--c-vermillion)}

/* ── insights ── */
.ins-grid{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
@media(max-width:520px){.ins-grid{grid-template-columns:1fr}}
.gaugebig{display:grid;place-items:center;position:relative}
.gaugebig .gv{position:absolute;text-align:center}
.gaugebig .gn{font-weight:200;font-size:30px;font-variant-numeric:tabular-nums}
.gaugebig .gl{font-family:"SF Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-faint);margin-top:2px}
.spark{margin-top:6px}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.bar{display:grid;grid-template-columns:74px 1fr 34px;gap:10px;align-items:center}
.bar .bl{font-family:"SF Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .btr{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar .btr>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c-cyan),var(--c-violet));transition:width .6s cubic-bezier(.22,1,.36,1)}
.bar .bn{font-family:"SF Mono",monospace;font-size:11px;color:var(--tx-secondary);text-align:right}
.insub{font-family:"SF Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-faint);margin:18px 0 10px}

/* ── work products ── */
.filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px}
.fchip{font-family:"SF Mono",monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:5px 11px;border-radius:99px;cursor:pointer;
  border:1px solid var(--border-subtle);background:var(--surf-1);color:var(--tx-muted);transition:border-color .15s,color .15s}
.fchip:hover{border-color:var(--border-accent);color:var(--tx-secondary)}
.fchip.on{background:color-mix(in srgb,var(--c-cyan) 14%,transparent);border-color:var(--border-accent);color:var(--c-cyan)}
.fchip .n{opacity:.6;margin-left:4px}
.tblwrap{border:1px solid var(--border-subtle);border-radius:10px;overflow:hidden}
.tbl-scroll{max-height:340px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;font-family:"SF Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-muted);
  text-align:left;padding:11px 14px;background:var(--surf-3);border-bottom:1px solid var(--border-default);white-space:nowrap;z-index:1}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border-faint);font-weight:300;color:var(--tx-secondary);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--tx-secondary) 4%,transparent)}
.kind{font-family:"SF Mono",monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap}
.art-t{color:var(--tx-primary)}
.art-p{font-family:"SF Mono",monospace;font-size:10px;color:var(--tx-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}

/* ── role drawer ── */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--bg-base) 55%,transparent);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:200}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;width:420px;max-width:92vw;height:100vh;background:var(--surf-2);border-left:1px solid var(--border-default);
  box-shadow:-24px 0 60px var(--sh-ambient);transform:translateX(102%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:300;overflow-y:auto;padding:28px}
.drawer.open{transform:none}
.drawer .dx{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--surf-3);color:var(--tx-muted);cursor:pointer;display:grid;place-items:center}
.drawer .dnm{font-size:22px;font-weight:200;margin-bottom:3px}
.drawer .darch{color:var(--tx-secondary);font-size:13px;margin-bottom:18px}
.drawer .dmeta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.drawer .dm{background:var(--surf-1);border:1px solid var(--border-subtle);border-radius:8px;padding:11px 13px}
.drawer .dm .dk{font-family:"SF Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-faint)}
.drawer .dm .dvv{font-size:15px;margin-top:5px}
.drawer .dsec{font-family:"SF Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-faint);margin:18px 0 9px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:11px;color:var(--tx-secondary);background:var(--surf-1);border:1px solid var(--border-subtle);border-radius:99px;padding:4px 11px}
.lockico{color:var(--c-amber)}
.empty{display:grid;place-items:center;min-height:160px;color:var(--tx-faint);font-family:"SF Mono",monospace;font-size:12px}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="4" fill="var(--c-cyan)"/><circle cx="6" cy="9" r="2.3" fill="var(--c-violet)"/><circle cx="26" cy="9" r="2.3" fill="var(--c-green)"/><circle cx="6" cy="23" r="2.3" fill="var(--c-ice)"/><circle cx="26" cy="23" r="2.3" fill="var(--c-amber)"/><g stroke="var(--c-cyan)" stroke-width="1" opacity=".5"><line x1="16" y1="16" x2="6" y2="9"/><line x1="16" y1="16" x2="26" y2="9"/><line x1="16" y1="16" x2="6" y2="23"/><line x1="16" y1="16" x2="26" y2="23"/></g></svg>
    <div><div class="bt"><b>NEXUS</b> LINK</div><div class="bs">agentic company</div></div>
  </div>
  <div class="spacer"></div>
  <span id="status" class="statuspill disarmed"><span class="sd"></span><span id="statustext">—</span></span>
  <span class="live"><span class="ld"></span><span id="updated">connecting…</span></span>
  <div class="tog"><button data-th="dark" class="on">dark</button><button data-th="light">light</button></div>
</div>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="stage">
    <div class="panel constellation">
      <div class="panel-h"><div class="pt">The collective</div><div class="pc" id="rosterCount">— roles · 6 groups</div></div>
      <div class="cwrap"><svg id="cstar" viewBox="0 0 640 640" role="img" aria-label="radial map of the agentic company"></svg></div>
      <div class="legend">
        <span class="li"><span class="lg" style="background:var(--c-cyan)"></span>native</span>
        <span class="li"><span class="lg" style="background:var(--c-violet)"></span>glm</span>
        <span class="li"><span class="lg" style="background:var(--c-ice)"></span>either</span>
        <span class="li"><svg width="11" height="11" viewBox="0 0 12 12" class="lockico"><path d="M3 5V3.5a3 3 0 016 0V5h.5v6h-7V5z" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>owner-gated</span>
        <span class="li" style="margin-left:auto;color:var(--tx-faint)">click a node for detail</span>
      </div>
    </div>

    <div class="panel runs">
      <div class="panel-h"><div class="pt">Runs</div><div class="pc" id="runsCount">— runs</div></div>
      <div class="runstream" id="runstream"></div>
    </div>
  </div>

  <div class="lower">
    <div class="panel">
      <div class="panel-h"><div class="pt">Work products</div><div class="pc" id="wpCount">— items</div></div>
      <div class="filters" id="kindFilters"></div>
      <div class="tblwrap"><div class="tbl-scroll"><table>
        <thead><tr><th>kind</th><th>title</th><th>role</th><th>created</th></tr></thead>
        <tbody id="wpBody"></tbody>
      </table></div></div>
    </div>

    <div class="panel">
      <div class="panel-h"><div class="pt">Insights</div><div class="pc">live</div></div>
      <div class="ins-grid">
        <div class="gaugebig">
          <svg width="170" height="170" viewBox="0 0 170 170" id="convGauge"></svg>
          <div class="gv"><div class="gn" id="convNum">—</div><div class="gl">convergence</div></div>
        </div>
        <div>
          <div class="insub" style="margin-top:0">throughput · artifacts / day</div>
          <svg class="spark" id="spark" width="100%" height="74" preserveAspectRatio="none" viewBox="0 0 320 74"></svg>
        </div>
      </div>
      <div class="insub">by kind</div>
      <div class="bars" id="kindBars"></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true"><button class="dx" id="dx" aria-label="close">✕</button><div id="drawerBody"></div></aside>

<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="hubg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="var(--c-ice)"/><stop offset="55%" stop-color="var(--c-cyan)"/><stop offset="100%" stop-color="var(--c-violet)"/></radialGradient>
</defs></svg>

<script>
const SVGNS="http://www.w3.org/2000/svg";
const GROUPS=["orchestration","research","engineering","verification","knowledge","operations"];
const SUBCOL={native:"var(--c-cyan)",glm:"var(--c-violet)",either:"var(--c-ice)"};
const KINDCOL={doc:"var(--c-cyan)",module:"var(--c-green)",test:"var(--c-amber)",report:"var(--c-violet)",blueprint:"var(--c-violet)",manifest:"var(--tx-muted)",config:"var(--tx-muted)",file:"var(--tx-faint)"};
let DATA=null, kindFilter="all", prevConv=0;

document.querySelectorAll('.tog button').forEach(b=>b.onclick=()=>{
  document.documentElement.setAttribute('data-theme',b.dataset.th);
  document.querySelectorAll('.tog button').forEach(x=>x.classList.toggle('on',x===b));
  if(DATA){buildStar(DATA);renderInsights(DATA);}
});

const svgEl=(t,a={})=>{const n=document.createElementNS(SVGNS,t);for(const k in a)n.setAttribute(k,a[k]);return n};
const H=(t,cls,html)=>{const n=document.createElement(t);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rel=iso=>{if(!iso)return"—";const d=(Date.now()-new Date(iso).getTime())/1000;if(d<60)return Math.max(0,d|0)+"s ago";if(d<3600)return (d/60|0)+"m ago";if(d<86400)return (d/3600|0)+"h ago";return (d/86400|0)+"d ago"};

// ── radial constellation ──
function buildStar(d){
  const svg=document.getElementById('cstar');svg.innerHTML="";
  const cx=320,cy=320,R=232;
  const rot=svgEl('g',{class:'rot'});
  for(const rr of [120,180,232])rot.append(svgEl('circle',{cx,cy,r:rr,fill:'none',stroke:'var(--border-faint)','stroke-width':1}));
  svg.append(rot);
  for(let i=0;i<3;i++){const pr=svgEl('circle',{cx,cy,r:42,class:'hub-ring pulsering',fill:'none','stroke-width':1.4});pr.style.animationDelay=(i*1.13)+'s';svg.append(pr)}
  const roles=d.roles||[];
  const byG={};GROUPS.forEach(g=>byG[g]=[]);roles.forEach(r=>(byG[r.group]||(byG[r.group]=[])).push(r));
  const linkLayer=svgEl('g',{}),nodeLayer=svgEl('g',{});
  const nodeIndex={};
  GROUPS.forEach((g,gi)=>{
    const list=byG[g]||[];const base=gi*60-90;
    const la=base*Math.PI/180, lr=R+36;
    const lab=svgEl('text',{x:cx+lr*Math.cos(la),y:cy+lr*Math.sin(la),class:'glabel','text-anchor':'middle','dominant-baseline':'middle'});lab.textContent=g;svg.append(lab);
    const a0=(base-26)*Math.PI/180,a1=(base+26)*Math.PI/180;
    linkLayer.append(svgEl('path',{d:`M${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}`,class:'garc',stroke:'var(--border-subtle)'}));
    const n=list.length;
    list.forEach((role,j)=>{
      const spread=44, ang=n===1?base:(base-spread/2 + spread*(j/(n-1)));
      const a=ang*Math.PI/180, x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
      const active=role.status==='active';
      const link=svgEl('line',{x1:cx,y1:cy,x2:x,y2:y,class:'clink'+(active?' energized':'')});
      link.dataset.role=role.id;linkLayer.append(link);
      const gnode=svgEl('g',{class:'cnode'+(active?' active':''),transform:`translate(${x},${y})`});
      gnode.dataset.role=role.id;
      gnode.append(svgEl('circle',{class:'core',r:active?11:9,fill:SUBCOL[role.substrate]||'var(--tx-muted)',stroke:'var(--bg-base)','stroke-width':2}));
      if(role.autonomyClass==='owner-gated')gnode.append(svgEl('circle',{r:14.5,fill:'none',stroke:'var(--c-amber)','stroke-width':1.2,'stroke-dasharray':'2 3',opacity:.8}));
      const tx=R*Math.cos(a)>=0?1:-1;
      const t=svgEl('text',{x:tx*16,y:4,'text-anchor':tx>0?'start':'end'});t.textContent=role.name;gnode.append(t);
      gnode.addEventListener('mouseenter',()=>highlight(role.id));
      gnode.addEventListener('mouseleave',()=>highlight(null));
      gnode.addEventListener('click',()=>openRole(role));
      nodeLayer.append(gnode);nodeIndex[role.id]={link,gnode,role};
    });
  });
  svg.append(linkLayer,nodeLayer);
  const hub=svgEl('g',{transform:`translate(${cx},${cy})`});
  hub.append(svgEl('circle',{r:30,fill:'url(#hubg)',filter:'url(#glow)'}));
  hub.append(svgEl('circle',{r:30,fill:'none',stroke:'var(--c-ice)','stroke-width':1,opacity:.6}));
  const ht=svgEl('text',{x:0,y:1,'text-anchor':'middle','dominant-baseline':'middle'});
  ht.setAttribute('style','font-size:8.5px;letter-spacing:.18em;fill:var(--tx-inverse);font-family:SF Mono,monospace;font-weight:600');ht.textContent='NEXUS';
  hub.append(ht);svg.append(hub);
  svg._nodeIndex=nodeIndex;
}
function highlight(id){
  const idx=(document.getElementById('cstar')._nodeIndex)||{};const on=id!=null;
  Object.entries(idx).forEach(([rid,o])=>{
    o.gnode.classList.toggle('dim',on&&rid!==id);
    o.link.classList.toggle('dim',on&&rid!==id);
    if(rid===id)o.link.classList.add('energized');
    else o.link.classList.toggle('energized',o.role.status==='active'&&!on);
  });
}

// ── KPIs ──
function renderKpis(d){
  const k=d.kpis||{};const box=document.getElementById('kpis');box.innerHTML="";
  const cards=[
    {k:'total runs',v:k.totalRuns,sub:'all time',ac:'var(--c-cyan)'},
    {k:'artifacts',v:k.totalArtifacts,sub:'produced',ac:'var(--c-violet)'},
    {k:'active runs',v:k.activeRuns,sub:'in flight',ac:'var(--c-amber)'},
    {k:'roles active',v:k.rolesActive,sub:'of '+(d.roleCount||(d.roles||[]).length),ac:'var(--c-green)'},
    {k:'artifacts today',v:k.artifactsToday,sub:'last 24h',ac:'var(--c-ice)'},
    {k:'convergence',v:Math.round((k.convergenceRate||0)*100),suf:'%',sub:'success rate',ac:'var(--c-green)'},
  ];
  for(const c of cards){
    const card=H('div','kpi');card.style.setProperty('--ac',c.ac);
    card.append(H('div','label',c.k));
    const v=H('div','v');v.append(document.createTextNode(c.v??0));if(c.suf){const s=document.createElement('small');s.textContent=c.suf;v.append(s)}
    card.append(v);card.append(H('div','sub',c.sub));box.append(card);
  }
}

// ── runs convergence stream ──
function gaugeSvg(pct,size,stroke,col,label){
  const r=(size-stroke)/2,c=2*Math.PI*r;
  const s=svgEl('svg',{width:size,height:size,viewBox:`0 0 ${size} ${size}`,class:'gauge'});
  s.append(svgEl('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:'var(--track)','stroke-width':stroke}));
  s.append(svgEl('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:col,'stroke-width':stroke,'stroke-linecap':'round','stroke-dasharray':c,'stroke-dashoffset':c*(1-pct),transform:`rotate(-90 ${size/2} ${size/2})`}));
  if(label!=null){const t=svgEl('text',{x:size/2,y:size/2+4,'text-anchor':'middle'});t.setAttribute('style','font-size:11px;fill:var(--tx-primary);font-family:SF Mono,monospace');t.textContent=label;s.append(t)}
  return s;
}
function renderRuns(d){
  const box=document.getElementById('runstream');box.innerHTML="";
  const runs=(d.runs||[]);
  document.getElementById('runsCount').textContent=(d.kpis?.totalRuns||runs.length)+' runs';
  if(!runs.length){box.append(H('div','empty','no runs yet'));return}
  const STAT={converged:['ok','converged'],running:['run','running'],forced:['forced','forced'],failed:['err','failed']};
  for(const r of runs.slice(0,40)){
    const col=r.status==='converged'?'var(--c-green)':r.status==='running'?'var(--c-amber)':r.status==='failed'?'var(--c-vermillion)':'var(--tx-muted)';
    const pct=r.status==='converged'?1:r.status==='failed'?0.18:r.status==='running'?0.5:0.62;
    const row=H('div','run');row.style.setProperty('--rc',col);
    row.append(gaugeSvg(pct,46,3.4,col,String(r.rounds||0)));
    const mid=H('div','rmid');
    mid.append(H('div','rid',esc(r.id)));
    mid.append(H('div','rmeta',(r.leafCount||0)+' leaves · '+rel(r.finished||r.started)));
    if(r.roles&&r.roles.length){const ch=H('div','rchips');r.roles.slice(0,4).forEach(x=>ch.append(H('span','rchip',esc(x))));mid.append(ch)}
    row.append(mid);
    const [pc,pl]=STAT[r.status]||['forced',r.status||'—'];
    row.append(H('div','rstat',`<span class="pill ${pc}"><span class="pd"></span>${esc(pl)}</span>`));
    box.append(row);
  }
}

// ── insights ──
function renderInsights(d){
  const k=d.kpis||{},st=d.stats||{};
  const pct=k.convergenceRate||0;const g=document.getElementById('convGauge');g.innerHTML="";
  const size=170,stroke=10,r=(size-stroke)/2,c=2*Math.PI*r;
  g.append(svgEl('circle',{cx:85,cy:85,r,fill:'none',stroke:'var(--track)','stroke-width':stroke}));
  const arc=svgEl('circle',{cx:85,cy:85,r,fill:'none',stroke:'var(--c-green)','stroke-width':stroke,'stroke-linecap':'round','stroke-dasharray':c,'stroke-dashoffset':c,transform:'rotate(-90 85 85)'});
  g.append(arc);requestAnimationFrame(()=>{arc.style.transition='stroke-dashoffset 1s cubic-bezier(.22,1,.36,1)';arc.setAttribute('stroke-dashoffset',c*(1-pct))});
  const target=Math.round(pct*100);animNum(document.getElementById('convNum'),prevConv,target,'%');prevConv=target;
  // throughput area
  const tp=st.throughput||[];const sp=document.getElementById('spark');sp.innerHTML="";
  if(tp.length>1){
    const max=Math.max(1,...tp.map(x=>x.count)),W=320,Hh=74,n=tp.length;
    const X=i=>i*(W/(n-1)),Y=v=>Hh-6-(v/max)*(Hh-14);
    let dd='M'+X(0)+' '+Y(tp[0].count);tp.forEach((p,i)=>{if(i)dd+=' L'+X(i)+' '+Y(p.count)});
    const grad=svgEl('linearGradient',{id:'spg',x1:0,y1:0,x2:0,y2:1});
    grad.append(svgEl('stop',{offset:'0%','stop-color':'var(--c-cyan)','stop-opacity':.35}));grad.append(svgEl('stop',{offset:'100%','stop-color':'var(--c-cyan)','stop-opacity':0}));sp.append(grad);
    sp.append(svgEl('path',{d:dd+` L${W} ${Hh} L0 ${Hh} Z`,fill:'url(#spg)'}));
    sp.append(svgEl('path',{d:dd,fill:'none',stroke:'var(--c-cyan)','stroke-width':1.6,'stroke-linejoin':'round'}));
    sp.append(svgEl('circle',{cx:X(n-1),cy:Y(tp[n-1].count),r:3,fill:'var(--c-ice)'}));
  } else { const t=svgEl('text',{x:160,y:40,'text-anchor':'middle'});t.setAttribute('style','fill:var(--tx-faint);font-size:11px;font-family:SF Mono,monospace');t.textContent='accumulating…';sp.append(t)}
  // by kind bars
  const bk=st.byKind||{};const entries=Object.entries(bk).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...entries.map(e=>e[1]));
  const bars=document.getElementById('kindBars');bars.innerHTML="";
  if(!entries.length){bars.append(H('div','empty','no data'));return}
  for(const [kind,n] of entries){
    const row=H('div','bar');row.append(H('div','bl',kind));
    const tr=H('div','btr');const fill=document.createElement('i');fill.style.width='0%';tr.append(fill);row.append(tr);
    row.append(H('div','bn',String(n)));bars.append(row);
    requestAnimationFrame(()=>fill.style.width=(n/mx*100)+'%');
  }
}
function animNum(node,from,to,suf){
  const t0=performance.now(),dur=800;
  function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);node.textContent=Math.round(from+(to-from)*e)+(suf||'');if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}

// ── work products ──
function renderWP(d){
  const arts=(d.artifacts||[]);
  document.getElementById('wpCount').textContent=arts.length+' items';
  const counts={};arts.forEach(a=>counts[a.kind]=(counts[a.kind]||0)+1);
  const fb=document.getElementById('kindFilters');fb.innerHTML="";
  const mk=(key,label,n)=>{const c=H('div','fchip'+(kindFilter===key?' on':''),esc(label)+(n!=null?`<span class="n">${n}</span>`:''));c.onclick=()=>{kindFilter=key;renderWP(DATA)};return c};
  fb.append(mk('all','all',arts.length));
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>fb.append(mk(k,k,n)));
  const body=document.getElementById('wpBody');body.innerHTML="";
  const rows=arts.filter(a=>kindFilter==='all'||a.kind===kindFilter).slice(0,120);
  if(!rows.length){body.append(H('tr',null,'<td colspan="4" style="text-align:center;color:var(--tx-faint);padding:24px">no items</td>'));return}
  for(const a of rows){
    const tr=document.createElement('tr');
    const col=KINDCOL[a.kind]||'var(--tx-muted)';
    tr.innerHTML=`<td><span class="kind" style="color:${col};background:color-mix(in srgb,${col} 14%,transparent)">${esc(a.kind)}</span></td>`+
      `<td><div class="art-t">${esc(a.title)}</div><div class="art-p">${esc(a.path)}</div></td>`+
      `<td class="mono" style="font-size:11px;color:var(--tx-muted)">${esc(a.role||'—')}</td>`+
      `<td class="mono" style="font-size:11px;color:var(--tx-faint)">${rel(a.created)}</td>`;
    body.append(tr);
  }
}

// ── role drawer ──
function openRole(role){
  const b=document.getElementById('drawerBody');
  const col=SUBCOL[role.substrate]||'var(--tx-muted)';
  const lock=role.autonomyClass==='owner-gated'?' <svg width="15" height="15" viewBox="0 0 12 12" class="lockico" style="vertical-align:-1px"><path d="M3 5V3.5a3 3 0 016 0V5h.5v6h-7V5z" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>':'';
  b.innerHTML=`<div class="dnm">${esc(role.name)}${lock}</div><div class="darch">${esc(role.archetype)}</div>`+
    `<div class="dmeta">`+
      `<div class="dm"><div class="dk">group</div><div class="dvv">${esc(role.group)}</div></div>`+
      `<div class="dm"><div class="dk">substrate</div><div class="dvv" style="color:${col};font-size:14px">${esc(role.substrate)} / ${esc(role.lane)}</div></div>`+
      `<div class="dm"><div class="dk">autonomy</div><div class="dvv" style="font-size:13px">${esc(role.autonomyClass)}</div></div>`+
      `<div class="dm"><div class="dk">status</div><div class="dvv" style="font-size:13px;color:${role.status==='active'?'var(--c-green)':'var(--tx-muted)'}">${esc(role.status)}</div></div>`+
    `</div>`+
    `<div class="dsec">activity</div><div class="dmeta">`+
      `<div class="dm"><div class="dk">runs</div><div class="dvv">${role.runs||0}</div></div>`+
      `<div class="dm"><div class="dk">artifacts</div><div class="dvv">${role.artifacts||0}</div></div>`+
    `</div>`+
    (role.capabilities&&role.capabilities.length?`<div class="dsec">capabilities</div><div class="tags">${role.capabilities.map(c=>`<span class="tg">${esc(c)}</span>`).join('')}</div>`:'')+
    (role.lastActive?`<div class="dsec">last active</div><div class="mono" style="color:var(--tx-muted);font-size:12px">${rel(role.lastActive)}</div>`:'');
  document.getElementById('scrim').classList.add('show');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){document.getElementById('scrim').classList.remove('show');document.getElementById('drawer').classList.remove('open')}
document.getElementById('scrim').onclick=closeDrawer;document.getElementById('dx').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

// ── poll ──
async function tick(){
  try{
    const r=await fetch('/api/overview',{cache:'no-store'});if(!r.ok)throw 0;
    const d=await r.json();DATA=d;
    const sp=document.getElementById('status');const armed=d.company?.armed;
    sp.className='statuspill '+(armed?'armed':'disarmed');
    document.getElementById('statustext').textContent=armed?'armed':'disarmed';
    document.getElementById('updated').textContent='updated '+rel(d.company?.generatedAt||new Date().toISOString());
    document.getElementById('rosterCount').textContent=(d.roleCount||(d.roles||[]).length)+' roles · 6 groups';
    renderKpis(d);buildStar(d);renderRuns(d);renderInsights(d);renderWP(d);
    document.title='NEXUS LINK — '+(d.kpis?.totalRuns||0)+' runs';
  }catch(e){document.getElementById('updated').textContent='connection lost — retrying';}
}
tick();setInterval(tick,3000);
setInterval(()=>{if(DATA&&DATA.company&&DATA.company.generatedAt)document.getElementById('updated').textContent='updated '+rel(DATA.company.generatedAt)},1000);
</script>
</body>
</html>
