<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="96" height="96" style="image-rendering:pixelated">
  <defs>
    <style>
      @keyframes scanline {
        0%   { opacity: 0.9; }
        50%  { opacity: 0.4; }
        100% { opacity: 0.9; }
      }
      @keyframes glitch {
        0%,90%,100% { transform: translate(0,0); }
        92%  { transform: translate(-2px,0); }
        94%  { transform: translate(2px,0); }
        96%  { transform: translate(0,1px); }
      }
      .sigil { animation: glitch 8s infinite; }
      .glow  { animation: scanline 3s ease-in-out infinite; }
    </style>
    <filter id="crt-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tablet body -->
  <rect x="8" y="8" width="112" height="112" rx="4" ry="4" fill="#000" stroke="#9FE873" stroke-width="2"/>

  <!-- Outer circuit border traces -->
  <rect x="12" y="12" width="104" height="4" fill="#3F5C1F"/>
  <rect x="12" y="112" width="104" height="4" fill="#3F5C1F"/>
  <rect x="12" y="16" width="4" height="96" fill="#3F5C1F"/>
  <rect x="112" y="16" width="4" height="96" fill="#3F5C1F"/>

  <!-- Corner nodes -->
  <rect x="12" y="12" width="8" height="8" fill="#9FE873"/>
  <rect x="108" y="12" width="8" height="8" fill="#9FE873"/>
  <rect x="12" y="108" width="8" height="8" fill="#9FE873"/>
  <rect x="108" y="108" width="8" height="8" fill="#9FE873"/>

  <!-- Center dot -->
  <rect x="60" y="60" width="8" height="8" fill="#76B900"/>

  <!-- Cuneiform wedge marks (left column) -->
  <g class="sigil" filter="url(#crt-glow)">
    <!-- Top wedge -->
    <rect x="28" y="28" width="12" height="4" fill="#9FE873"/>
    <rect x="28" y="32" width="4"  height="4" fill="#9FE873"/>
    <rect x="28" y="36" width="8"  height="4" fill="#76B900"/>

    <!-- Mid wedge -->
    <rect x="28" y="52" width="12" height="4" fill="#9FE873"/>
    <rect x="32" y="56" width="8"  height="4" fill="#9FE873"/>
    <rect x="28" y="60" width="4"  height="4" fill="#76B900"/>

    <!-- Bottom wedge -->
    <rect x="28" y="76" width="12" height="4" fill="#9FE873"/>
    <rect x="28" y="80" width="4"  height="4" fill="#9FE873"/>
    <rect x="28" y="84" width="8"  height="4" fill="#76B900"/>
  </g>

  <!-- Cuneiform wedge marks (right column) -->
  <g class="sigil" filter="url(#crt-glow)">
    <!-- Top wedge -->
    <rect x="72" y="28" width="4" height="12" fill="#9FE873"/>
    <rect x="76" y="28" width="4" height="4"  fill="#9FE873"/>
    <rect x="80" y="28" width="4" height="8"  fill="#76B900"/>

    <!-- Mid wedge -->
    <rect x="72" y="52" width="4" height="12" fill="#9FE873"/>
    <rect x="76" y="56" width="4" height="8"  fill="#9FE873"/>
    <rect x="80" y="52" width="4" height="4"  fill="#76B900"/>

    <!-- Bottom wedge -->
    <rect x="72" y="76" width="4" height="12" fill="#9FE873"/>
    <rect x="76" y="76" width="4" height="4"  fill="#9FE873"/>
    <rect x="80" y="80" width="4" height="8"  fill="#76B900"/>
  </g>

  <!-- Horizontal circuit trace -->
  <rect x="24" y="64" width="16" height="2" fill="#3F5C1F"/>
  <rect x="88" y="64" width="16" height="2" fill="#3F5C1F"/>
  <rect x="52" y="64" width="24" height="2" fill="#76B900"/>

  <!-- Vertical circuit trace -->
  <rect x="64" y="24" width="2" height="16" fill="#3F5C1F"/>
  <rect x="64" y="88" width="2" height="16" fill="#3F5C1F"/>
  <rect x="64" y="52" width="2" height="24" fill="#76B900"/>

  <!-- Scanline overlay -->
  <g class="glow" opacity="0.15">
    <rect x="8" y="8"  width="112" height="2" fill="#9FE873"/>
    <rect x="8" y="20" width="112" height="2" fill="#9FE873"/>
    <rect x="8" y="32" width="112" height="2" fill="#9FE873"/>
    <rect x="8" y="44" width="112" height="2" fill="#9FE873"/>
    <rect x="8" y="56" width="112" height="2" fill="#9FE873"/>
    <rect x="8" y="68" width="112" height="2" fill="#9FE873"/>
    <rect x="8" y="80" width="112" height="2" fill="#9FE873"/>
    <rect x="8" y="92" width="112" height="2" fill="#9FE873"/>
    <rect x="8" y="104" width="112" height="2" fill="#9FE873"/>
  </g>
</svg>
