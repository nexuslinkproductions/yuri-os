<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Assistant Panel</title>
    <style>
      body {
        margin: 0;
        background: #101214;
        color: #f2f4f3;
        font: 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      button {
        height: 32px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        background: #1d2226;
        color: #f2f4f3;
        cursor: pointer;
      }

      pre {
        margin: 0;
        min-height: 180px;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        background: #0b0d0f;
        color: #ffc857;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <button id="snapshot">Capture DOMSnapshot</button>
      <pre id="output">Idle</pre>
    </main>
    <script type="module" src="/src/devtools/devtoolsPanel.ts"></script>
  </body>
</html>
