[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrecon"
version = "1.1.0"
description = "Reusable graph-engineered recon loop template (stdlib-only Python 3.11)"
requires-python = ">=3.11"
[project.scripts]
graph-recon = "reconloop.cli:main"

[tool.setuptools]
packages = ["reconloop"]

[tool.setuptools.package-data]
reconloop = ["schemas/*.json", "schemas/*.sha256"]

# scaffold template sources — shipped so `graph-recon init` from an installed
# wheel produces a COMPLETE runnable project: reconloop/ engine (py + schemas
# + pins), scanners/ + packs/ (M4-W5), and a pyproject.toml template (M5-W1).
# NOTE: setuptools data-files FLATTEN globbed subdirectories (reconloop/schemas/*
# would land as graphrecon-template/reconloop/*.json), so schemas get their own
# destination key to preserve the reconloop/schemas/ layout the engine expects.
# The starter .gitignore is generated by reconloop/scaffold.py (STARTER_GITIGNORE),
# so it is intentionally not vendored here (single source of truth).
[tool.setuptools.data-files]
"graphrecon-template/scanners" = ["scanners/*.py"]
"graphrecon-template/packs/yuri" = ["packs/yuri/*.py", "packs/yuri/*.json", "packs/yuri/*.md"]
"graphrecon-template/reconloop" = ["reconloop/*.py"]
"graphrecon-template/reconloop/schemas" = ["reconloop/schemas/*.json", "reconloop/schemas/*.sha256"]
"graphrecon-template" = ["template/pyproject.toml"]
