[package]
name = "nexus"
version = "0.1.0"
edition = "2021"
description = "NEXUS — YURI's deterministic, embedding-free math substrate in Rust (bit-exact with the JS reference). MinHash/LSH + Jaccard prefix-filter matcher + φ/Fibonacci primitives. napi + wasm bindings."
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[build-dependencies]
napi-build = "2"

[features]
default = []
napi-binding = ["dep:napi", "dep:napi-derive"]
wasm-binding = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 3
lto = true
