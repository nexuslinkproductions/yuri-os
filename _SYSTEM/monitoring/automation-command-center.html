<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YURI OS · Automation Command Center</title>
<style>
:root {
  --bg: #080810;
  --sidebar-bg: #0d0d1a;
  --panel: rgba(20,22,20,0.7);
  --panel-soft: rgba(255,255,255,0.035);
  --border: rgba(255,255,255,0.08);
  --green: #47C01B;
  --cyan: #1AFFE4;
  --red: #FF3333;
  --amber: #FF8800;
  --text: #E8E8E8;
  --muted: #8585A8;
  --muted-2: #5f6078;
  --grey: #8585A8;
  --transition: all 0.2s ease;
}
* { box-sizing: border-box; }
html, body, #app { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
.shell {
  display: grid;
  grid-template-columns: 200px 1fr;
  height: 100vh;
  min-width: 0;
}
.sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow-y: auto;
}
.side-inner {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  padding: 18px 14px;
}
.brand {
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
}
.brand-title {
  color: var(--green);
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0;
  text-shadow: 0 0 18px rgba(71,192,27,0.35);
}
.brand-subtitle {
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}
.health-score {
  padding: 18px 0 12px;
}
.health-number {
  font-size: 44px;
  font-weight: 900;
  line-height: 0.95;
}
.health-label {
  color: var(--muted);
  font-size: 11px;
  margin-top: 7px;
}
.issue-pill {
  align-items: center;
  border: 1px solid currentColor;
  border-radius: 7px;
  display: inline-flex;
  font-size: 11px;
  font-weight: 800;
  gap: 7px;
  margin-bottom: 18px;
  padding: 7px 9px;
}
.services {
  border-bottom: 1px solid var(--border);
  border-top: 1px solid var(--border);
  display: grid;
  gap: 9px;
  padding: 16px 0;
}
.service-row {
  align-items: center;
  display: grid;
  grid-template-columns: 10px 1fr auto;
  gap: 8px;
  min-width: 0;
}
.service-name {
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.service-status {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
}
.dot {
  border-radius: 50%;
  display: inline-block;
  height: 9px;
  width: 9px;
}
.dot.running, .dot.ok {
  animation: pulse-green 1.5s infinite;
  background: var(--green);
  box-shadow: 0 0 12px rgba(71,192,27,0.45);
}
.dot.crashed, .dot.fail, .dot.dead { background: var(--red); }
.dot.exited_ok, .dot.aging { background: var(--cyan); }
.dot.never_run, .dot.unknown, .dot.missing { background: var(--grey); }
.dot.stale, .dot.missed_window, .dot.attention { background: var(--amber); }
@keyframes pulse-green {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.62; transform: scale(1.15); }
}
.nav {
  display: grid;
  gap: 5px;
  padding: 16px 0;
}
.nav-btn {
  background: transparent;
  border: 0;
  border-left: 3px solid transparent;
  color: var(--muted);
  cursor: pointer;
  padding: 10px 10px;
  text-align: left;
  transition: var(--transition);
}
.nav-btn:hover { background: rgba(255,255,255,0.03); color: var(--text); }
.nav-btn.active {
  border-left-color: var(--cyan);
  color: var(--cyan);
  background: rgba(26,255,228,0.06);
}
.side-bottom {
  color: var(--muted);
  display: grid;
  gap: 8px;
  font-size: 10px;
  margin-top: auto;
  padding-top: 18px;
}
.main {
  min-width: 0;
  overflow-y: auto;
  padding: 20px;
}
.main-header {
  align-items: end;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 16px;
  padding-bottom: 14px;
}
.title {
  font-size: 24px;
  font-weight: 900;
  line-height: 1.1;
}
.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 6px;
}
.meta {
  color: var(--muted);
  font-size: 11px;
  text-align: right;
}
.empty {
  align-items: center;
  color: var(--green);
  display: flex;
  flex-direction: column;
  font-size: 18px;
  font-weight: 800;
  justify-content: center;
  min-height: 52vh;
  text-align: center;
}
.empty-mark {
  border: 2px solid rgba(71,192,27,0.45);
  border-radius: 50%;
  box-shadow: 0 0 42px rgba(71,192,27,0.18);
  display: grid;
  font-size: 74px;
  height: 130px;
  margin-bottom: 22px;
  place-items: center;
  width: 130px;
}
.section {
  margin-bottom: 22px;
}
.section-title {
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
  margin: 0 0 9px;
  text-transform: uppercase;
}
.issue-row {
  align-items: center;
  border-bottom: 1px solid var(--border);
  display: grid;
  gap: 12px;
  grid-template-columns: 4px minmax(140px, 1fr) auto minmax(160px, 2fr);
  min-height: 42px;
  padding: 10px 16px 10px 0;
  transition: var(--transition);
}
.issue-row:hover, .data-row:hover, .agent-detail:hover { background: rgba(255,255,255,0.03); }
.bar {
  align-self: stretch;
  border-radius: 999px;
  width: 4px;
}
.name {
  font-weight: 800;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.detail {
  color: var(--muted);
  font-size: 12px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.badge, .chip {
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 7px;
  display: inline-flex;
  font-size: 10px;
  font-weight: 800;
  justify-content: center;
  min-width: 62px;
  padding: 5px 7px;
  text-transform: uppercase;
}
.badge.running, .badge.live, .badge.on_schedule, .chip.fresh { background: rgba(71,192,27,0.1); color: var(--green); }
.badge.crashed, .chip.dead, .chip.missing { background: rgba(255,51,51,0.1); color: var(--red); }
.badge.exited_ok, .chip.aging { background: rgba(26,255,228,0.09); color: var(--cyan); }
.badge.never_run, .badge.unknown { background: rgba(133,133,168,0.08); color: var(--grey); }
.badge.missed_window, .badge.attention, .chip.stale { background: rgba(255,136,0,0.1); color: var(--amber); }
.table {
  border: 1px solid var(--border);
  border-bottom: 0;
}
.table-head, .data-row {
  display: grid;
  gap: 10px;
  min-width: 760px;
}
.agents-table .table-head, .agents-table .data-row {
  grid-template-columns: 120px minmax(160px,1.35fr) 110px 86px minmax(130px,0.9fr) minmax(145px,1fr) 80px;
}
.state-table .table-head, .state-table .data-row {
  grid-template-columns: 4px minmax(170px,1fr) 120px 90px minmax(220px,1.4fr);
}
.table-scroller { overflow-x: auto; }
.table-head {
  background: rgba(255,255,255,0.035);
  color: var(--muted);
  font-size: 10px;
  font-weight: 900;
  padding: 10px 12px;
  text-transform: uppercase;
}
.data-row {
  align-items: center;
  border-bottom: 1px solid var(--border);
  cursor: default;
  min-height: 40px;
  padding: 0 12px;
  transition: var(--transition);
}
.data-row.crashed { background: rgba(255,51,51,0.06); box-shadow: inset 3px 0 0 var(--red); }
.data-row.running { background: rgba(71,192,27,0.04); }
.status-cell {
  align-items: center;
  display: flex;
  gap: 8px;
}
.tech {
  color: var(--muted);
  font-size: 11px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.agent-detail {
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  display: grid;
  gap: 7px;
  padding: 10px 14px 12px 32px;
}
.detail-line {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.accordion {
  border: 1px solid var(--border);
  margin-bottom: 10px;
}
.accordion-btn {
  align-items: center;
  background: rgba(255,255,255,0.025);
  border: 0;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  padding: 12px 14px;
  width: 100%;
}
.phase-pill {
  background: rgba(26,255,228,0.08);
  border: 1px solid rgba(26,255,228,0.22);
  border-radius: 7px;
  color: var(--cyan);
  font-size: 11px;
  font-weight: 900;
  padding: 6px 8px;
}
.phase-count {
  color: var(--muted);
  font-size: 11px;
}
.scripts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 14px 14px;
}
.script-chip {
  background: rgba(133,133,168,0.13);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 7px;
  color: var(--text);
  font-size: 11px;
  padding: 7px 9px;
}
.error {
  border: 1px solid rgba(255,51,51,0.24);
  color: var(--red);
  padding: 16px;
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    border-bottom: 1px solid var(--border);
    border-right: 0;
    max-height: 42vh;
  }
  .main { padding: 16px; }
  .main-header { align-items: start; flex-direction: column; }
  .meta { text-align: left; }
  .issue-row { grid-template-columns: 4px 1fr; }
  .issue-row .badge, .issue-row .detail { grid-column: 2; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = 'http://localhost:4242/health.json';
const STATUS_COLOR = {
  running: '#47C01B',
  live: '#47C01B',
  on_schedule: '#47C01B',
  crashed: '#FF3333',
  exited_ok: '#1AFFE4',
  on_demand: '#1AFFE4',
  attention: '#FF8800',
  missed_window: '#FF8800',
  never_run: '#8585A8',
  unknown: '#8585A8'
};
const FRESHNESS_COLOR = {
  fresh: '#47C01B',
  aging: '#1AFFE4',
  stale: '#FF8800',
  dead: '#FF3333',
  missing: '#8585A8'
};
const SERVICE_LABELS = {
  backend: 'backend',
  openclaw: 'openclaw',
  dream_synthesis: 'dream-sync',
  worker_bridge: 'workers',
  session_buffer: 'session-mem'
};
const FRESHNESS_RANK = { dead: 0, missing: 0, stale: 1, aging: 2, fresh: 3 };
let activeTab = 'issues';
let lastData = null;
let countdown = 30;
let countdownTimer = null;
const openHooks = new Set();
const expandedAgents = new Set();

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function fmtTime(value) {
  if (!value) return 'unknown';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleString();
}

function fmtAge(value) {
  if (value === null || value === undefined || Number.isNaN(Number(value))) return '--';
  return Number(value).toFixed(Number(value) < 10 ? 1 : 0) + 'h';
}

function fmtInterval(seconds, schedule) {
  if (schedule) return schedule;
  if (!seconds) return 'keepalive';
  if (seconds < 60) return seconds + 's';
  if (seconds < 3600) return Math.round(seconds / 60) + 'm';
  if (seconds < 86400) return Math.round(seconds / 3600) + 'h';
  return Math.round(seconds / 86400) + 'd';
}

function colorForStatus(status) {
  return STATUS_COLOR[status] || STATUS_COLOR.unknown;
}

function colorForFreshness(freshness) {
  return FRESHNESS_COLOR[freshness] || FRESHNESS_COLOR.missing;
}

function collectIssues(data) {
  const agents = data.launchagents || [];
  const states = Object.entries(data.state_files || {}).map(([name, item]) => ({ name, ...item }));
  return {
    crashed: agents.filter((agent) => agent.status === 'crashed'),
    staleAgents: agents.filter((agent) => agent.status !== 'crashed' && agent.timing?.stale),
    dead: states.filter((item) => item.freshness === 'dead' || item.freshness === 'missing'),
    stale: states.filter((item) => item.freshness === 'stale'),
    aging: states.filter((item) => item.freshness === 'aging')
  };
}

function issueCount(data) {
  const issues = collectIssues(data);
  return Object.values(issues).reduce((sum, list) => sum + list.length, 0);
}

function healthScore(data) {
  const agents = data.launchagents || [];
  if (!agents.length) return 0;
  const healthy = agents.filter((agent) => agent.status === 'running' || agent.status === 'exited_ok').length;
  return Math.round((healthy / agents.length) * 100);
}

function scoreColor(score) {
  if (score >= 90) return 'var(--green)';
  if (score >= 70) return 'var(--amber)';
  return 'var(--red)';
}

function renderSidebar(data) {
  const score = healthScore(data);
  const issues = issueCount(data);
  const services = data.services || {};
  const nav = ['issues', 'agents', 'state', 'hooks'];
  const serviceRows = Object.entries(SERVICE_LABELS).map(([key, label]) => {
    const status = services[key]?.status || 'missing';
    const ok = status === 'ok';
    return `<div class="service-row">
      <span class="dot ${ok ? 'ok' : 'fail'}"></span>
      <span class="service-name">${escapeHtml(label)}</span>
      <span class="service-status">${escapeHtml(status)}</span>
    </div>`;
  }).join('');
  return `<aside class="sidebar">
    <div class="side-inner">
      <div class="brand">
        <div class="brand-title">YURI OS</div>
        <div class="brand-subtitle">COMMAND CENTER</div>
      </div>
      <div class="health-score">
        <div class="health-number" style="color:${scoreColor(score)}">${score}%</div>
        <div class="health-label">HEALTHY AGENTS</div>
      </div>
      <div class="issue-pill" style="color:${issues ? 'var(--red)' : 'var(--green)'}">${issues ? `${issues} ISSUES` : '✓ ALL CLEAR'}</div>
      <div class="services">${serviceRows}</div>
      <nav class="nav" aria-label="Monitoring tabs">
        ${nav.map((name) => `<button class="nav-btn ${activeTab === name ? 'active' : ''}" onclick="setTab('${name}')">${name.toUpperCase()}</button>`).join('')}
      </nav>
      <div class="side-bottom">
        <div>last: <span id="lastFetch">${fmtTime(data.generated_at)}</span></div>
        <div>↺ <span id="countdown">${countdown}</span>s</div>
      </div>
    </div>
  </aside>`;
}

function renderHeader(title, subtitle, data) {
  return `<header class="main-header">
    <div>
      <div class="title">${title}</div>
      <div class="subtitle">${subtitle}</div>
    </div>
    <div class="meta">
      <div>generated: ${fmtTime(data.generated_at)}</div>
      <div>commit: ${escapeHtml(data.build_commit || 'unknown')}</div>
    </div>
  </header>`;
}

function renderIssues(data) {
  const issues = collectIssues(data);
  const total = issueCount(data);
  const sectionMap = [
    ['CRASHED', 'crashed', 'status', 'exit'],
    ['MISSED SCHEDULE', 'staleAgents', 'timing', 'schedule'],
    ['DEAD', 'dead', 'freshness', 'age'],
    ['STALE', 'stale', 'freshness', 'age'],
    ['AGING', 'aging', 'freshness', 'age']
  ];
  if (!total) {
    return `${renderHeader('✓ ALL SYSTEMS NOMINAL', 'No crashed agents or stale state files detected.', data)}
      <div class="empty"><div class="empty-mark">✓</div><div>ALL CLEAR</div></div>`;
  }
  const sections = sectionMap.map(([title, key, type, detailType]) => {
    const list = issues[key];
    if (!list.length) return '';
    const rows = list.map((item) => {
      const timingStatus = item.timing?.status || 'unknown';
      const status = type === 'status' ? item.status : type === 'timing' ? timingStatus : item.freshness;
      const color = type === 'status' ? colorForStatus(status) : type === 'timing' ? colorForStatus(status) : colorForFreshness(status);
      const detail = detailType === 'exit'
        ? `exit ${item.last_exit_code ?? 'unknown'} · ${fmtTime(item.last_run_iso)}`
        : detailType === 'schedule'
          ? `${item.timing?.expectation || 'schedule unknown'} · ${fmtAge(item.timing?.age_hours)}`
          : `${fmtAge(item.age_hours)} · ${fmtTime(item.mtime_iso)}`;
      return `<div class="issue-row">
        <span class="bar" style="background:${color}"></span>
        <span class="name">${escapeHtml(item.name)}</span>
        <span class="badge ${escapeHtml(status)}">${escapeHtml(status)}</span>
        <span class="detail">${escapeHtml(detail)}</span>
      </div>`;
    }).join('');
    return `<section class="section"><h2 class="section-title">${title}</h2>${rows}</section>`;
  }).join('');
  return `${renderHeader('⚠ ' + total + ' ISSUES', 'Crashed agents and stale state files, sorted by operational risk.', data)}${sections}`;
}

function toggleAgent(label) {
  if (expandedAgents.has(label)) expandedAgents.delete(label);
  else expandedAgents.add(label);
  renderAll(lastData);
}

function renderAgents(data) {
  function relTime(iso) {
    if (!iso) return '--';
    const h = (Date.now() - new Date(iso)) / 3600000;
    if (Number.isNaN(h)) return '--';
    if (h < 1) return Math.round(h * 60) + 'm ago';
    if (h < 24) return Math.round(h) + 'h ago';
    return Math.round(h / 24) + 'd ago';
  }

  const rows = (data.launchagents || []).map((agent) => {
    const label = agent.label || agent.name;
    const open = expandedAgents.has(label);
    const timing = agent.timing || {};
    const timingStatus = timing.status || 'unknown';
    const activityText = timing.pid_alive ? 'pid live' : relTime(agent.last_run_iso);
    const stateText = timing.state_freshness ? `${timing.state_file || 'state'} · ${timing.state_freshness}` : '--';
    const row = `<div class="data-row ${escapeHtml(agent.status)}" onclick="toggleAgent('${escapeHtml(label)}')">
      <div class="status-cell"><span class="dot ${escapeHtml(agent.status)}"></span><span>${escapeHtml(agent.status || 'unknown')}</span></div>
      <div class="name">${escapeHtml(agent.name)}</div>
      <div class="tech">${escapeHtml(fmtInterval(agent.interval_seconds, agent.schedule))}</div>
      <div class="tech">${escapeHtml(agent.last_exit_code ?? '--')}</div>
      <div><span class="badge ${escapeHtml(timingStatus)}">${escapeHtml(timingStatus)}</span></div>
      <div class="tech" title="${escapeHtml(agent.last_run_iso || '')}">${escapeHtml(activityText)}</div>
      <div class="tech">${escapeHtml(agent.pid ?? '--')}</div>
    </div>`;
    const detail = open ? `<div class="agent-detail">
      <div class="detail-line">label: ${escapeHtml(agent.label)}</div>
      <div class="detail-line">schedule: ${escapeHtml(agent.schedule || fmtInterval(agent.interval_seconds))}</div>
      <div class="detail-line">launchd stdout: ${escapeHtml(fmtTime(timing.last_stdout_mtime_iso || agent.last_run_iso))}</div>
      <div class="detail-line">state file: ${escapeHtml(stateText)} · ${escapeHtml(fmtTime(timing.state_mtime_iso))}</div>
      <div class="detail-line">expectation: ${escapeHtml(timing.expectation || 'unknown')}</div>
    </div>` : '';
    return row + detail;
  }).join('');
  return `${renderHeader('AGENTS', 'LaunchAgent status table. Activity, schedule, and state freshness are separated.', data)}
    <div class="table-scroller"><div class="table agents-table">
      <div class="table-head"><div>status</div><div>name</div><div>interval</div><div>exit</div><div>schedule</div><div>activity</div><div>PID</div></div>
      ${rows}
    </div></div>`;
}

function renderStateFiles(data) {
  const states = Object.entries(data.state_files || {})
    .map(([name, item]) => ({ name, ...item }))
    .sort((a, b) => (FRESHNESS_RANK[a.freshness] ?? 0) - (FRESHNESS_RANK[b.freshness] ?? 0));
  const rows = states.map((item) => `<div class="data-row">
    <span class="bar" style="background:${colorForFreshness(item.freshness)}"></span>
    <div class="name">${escapeHtml(item.name)}</div>
    <div><span class="chip ${escapeHtml(item.freshness)}">${escapeHtml(item.freshness || 'missing')}</span></div>
    <div class="tech">${escapeHtml(fmtAge(item.age_hours))}</div>
    <div class="tech">${escapeHtml(fmtTime(item.mtime_iso))}</div>
  </div>`).join('');
  return `${renderHeader('STATE FILES', 'Freshness sorted from dead or missing to fresh.', data)}
    <div class="table-scroller"><div class="table state-table">
      <div class="table-head"><div></div><div>name</div><div>freshness</div><div>age</div><div>mtime</div></div>
      ${rows}
    </div></div>`;
}

function toggleHook(phase) {
  if (openHooks.has(phase)) openHooks.delete(phase);
  else openHooks.add(phase);
  renderAll(lastData);
}

function renderHooks(data) {
  const hooks = data.claude_hooks?.hooks_by_phase || {};
  const groups = Object.entries(hooks).map(([phase, scripts]) => {
    const open = openHooks.has(phase);
    return `<section class="accordion">
      <button class="accordion-btn" onclick="toggleHook('${escapeHtml(phase)}')">
        <span class="phase-pill">${escapeHtml(phase)}</span>
        <span class="phase-count">${scripts.length} scripts ${open ? '▼' : '▶'}</span>
      </button>
      ${open ? `<div class="scripts">${scripts.map((script) => `<span class="script-chip">${escapeHtml(script)}</span>`).join('')}</div>` : ''}
    </section>`;
  }).join('');
  return `${renderHeader('HOOKS', `${data.claude_hooks?.total_scripts || 0} Claude hook scripts grouped by phase.`, data)}${groups}`;
}

function renderMain(data) {
  if (activeTab === 'agents') return renderAgents(data);
  if (activeTab === 'state') return renderStateFiles(data);
  if (activeTab === 'hooks') return renderHooks(data);
  return renderIssues(data);
}

function renderAll(data) {
  if (!data) return;
  lastData = data;
  document.getElementById('app').innerHTML = `<div class="shell">${renderSidebar(data)}<main class="main">${renderMain(data)}</main></div>`;
}

function setTab(name) {
  activeTab = name;
  renderAll(lastData);
}

function startCountdown() {
  countdown = 30;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    countdown = Math.max(0, countdown - 1);
    const el = document.getElementById('countdown');
    if (el) el.textContent = String(countdown);
  }, 1000);
}

async function refresh() {
  try {
    const response = await fetch(API + '?t=' + Date.now());
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (openHooks.size === 0 && data.claude_hooks?.hooks_by_phase) {
      Object.keys(data.claude_hooks.hooks_by_phase).forEach((phase) => openHooks.delete(phase));
    }
    renderAll(data);
    startCountdown();
  } catch (error) {
    document.getElementById('app').innerHTML = `<div class="shell">
      <aside class="sidebar"><div class="side-inner"><div class="brand"><div class="brand-title">YURI OS</div><div class="brand-subtitle">COMMAND CENTER</div></div></div></aside>
      <main class="main"><div class="error">health fetch failed: ${escapeHtml(error.message)}</div></main>
    </div>`;
  }
}

setInterval(refresh, 30000);
refresh();
</script>
</body>
</html>
