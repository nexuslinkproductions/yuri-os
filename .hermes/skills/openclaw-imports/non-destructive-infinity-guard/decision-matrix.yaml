infinity_guard_decision_matrix:
  low:
    examples:
      - read file
      - summarize document
      - generate plan
      - create report in staging folder
    default_decision: allow_with_log
  medium:
    examples:
      - create new file in staging
      - generate patch
      - propose command
      - create memory proposal
    default_decision: stage_with_log
  high:
    examples:
      - modify existing source file
      - edit skill file
      - change memory index
      - run local script
    default_decision: require_approval_and_rollback
  critical:
    examples:
      - delete files
      - overwrite repository structure
      - deploy
      - access secrets
      - write to external systems
      - disable guardrails
    default_decision: block_by_default
safe_alternatives:
  delete_files: "create deletion proposal with file list and justification"
  overwrite_files: "write proposed replacement to staging path"
  execute_untrusted_code: "inspect code statically and run only in approved sandbox"
  memory_mutation: "create memory update proposal with evidence and rollback"
