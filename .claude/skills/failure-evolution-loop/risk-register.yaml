risks:
  - risk: "Rewarding avoidable failure"
    severity: high
    likelihood: medium
    impact: "Can reduce reliability, safety, or enterprise readiness of failure-evolution-loop."
    mitigation: "Only learn from real incidents, test failures, or user feedback; prohibit self-harm loops."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
  - risk: "Bad memory updates"
    severity: high
    likelihood: medium
    impact: "Can reduce reliability, safety, or enterprise readiness of failure-evolution-loop."
    mitigation: "Memory changes must include evidence, scope, and rollback."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
  - risk: "Overcorrecting from one incident"
    severity: medium
    likelihood: medium
    impact: "Can reduce reliability, safety, or enterprise readiness of failure-evolution-loop."
    mitigation: "Require recurrence or severity threshold for global rules."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
  - risk: "Hiding failures"
    severity: critical
    likelihood: low
    impact: "Can reduce reliability, safety, or enterprise readiness of failure-evolution-loop."
    mitigation: "Failures are logged with impact and remediation status."
    detection: "Audit events, test failures, guard decisions, and human review."
    rollback: "Revert staged changes, remove proposed memory updates, and preserve incident report."
