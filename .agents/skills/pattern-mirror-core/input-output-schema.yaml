extension_id: "pattern-mirror-core"
version: "1.0.0"
input:
  goal:
    type: string
    required: true
  artifact_type:
    type: enum
    values: ['repo', 'document', 'pdf', 'prompt', 'codebase', 'system_spec', 'workflow', 'memory_log']
    required: true
  target:
    type: string
    required: true
  mode:
    type: enum
    values: ['passive-pattern-awareness', 'active-artifact-analysis', 'audit-reconstruction', 'integration-planning', 'quarantine-on-unsafe-provenance']
    required: true
  constraints:
    enterprise_mode:
      type: boolean
      default: true
    destructive_actions_allowed:
      type: boolean
      default: false
    require_audit_trail:
      type: boolean
      default: true
    require_rollback_plan:
      type: boolean
      default: true
    max_risk:
      type: enum
      values: [low, medium, high, critical]
      default: medium
output:
  extension_id: "pattern-mirror-core"
  summary: string
  findings:
    - id: string
      type: string
      severity: low | medium | high | critical
      evidence: []
      recommendation: string
  implementation_plan:
    phases: []
    files_to_create: []
    files_to_modify: []
    approval_gates: []
  safety_report:
    risks: []
    blocked_actions: []
    rollback_plan: string
  memory_update_proposals:
    semantic: []
    procedural: []
    episodic: []
  audit_events: []
