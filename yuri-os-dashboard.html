<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YURI OS · Force Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --gold: #D4AF37;
  --blue: #1E3A8A;
  --mist: #A8BCC6;
  --bone: #F2E9D2;
  --fire: #C95A3B;
  --cyan: #00e5bf;
  --soil: #4A3B32;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--bone);
  font-family: "JetBrains Mono", monospace;
}

body {
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255, 255, 255, 0.018) 0,
      rgba(255, 255, 255, 0.018) 1px,
      transparent 1px,
      transparent 4px
    );
  opacity: 0.42;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background:
    radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.075), transparent 34%),
    #080808;
}

.brand-lockup {
  position: fixed;
  top: 12px;
  left: 16px;
  z-index: 5;
  pointer-events: none;
}

.brand-title {
  color: var(--gold);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  line-height: 1.2;
}

.brand-subtitle {
  margin-top: 4px;
  color: var(--soil);
  font-size: 10px;
  line-height: 1.2;
}

.soak-status {
  position: fixed;
  top: 12px;
  right: 16px;
  z-index: 5;
  display: grid;
  grid-template-columns: 32px auto;
  column-gap: 8px;
  row-gap: 2px;
  align-items: center;
  color: var(--mist);
  font-size: 10px;
  line-height: 1.2;
  pointer-events: none;
}

.soak-ring {
  grid-row: 1 / 3;
  width: 32px;
  height: 32px;
}

.critical-pulse {
  color: var(--fire);
  animation: criticalPulse 1.35s ease-in-out infinite;
}

.bottom-strip {
  position: fixed;
  left: 50%;
  bottom: 12px;
  z-index: 5;
  transform: translateX(-50%);
  color: var(--mist);
  font-size: 10px;
  letter-spacing: 0.08em;
  white-space: nowrap;
  pointer-events: none;
}

.legend {
  position: fixed;
  left: 16px;
  bottom: 14px;
  z-index: 5;
  display: grid;
  gap: 6px;
  color: var(--mist);
  font-size: 9px;
  letter-spacing: 0.08em;
  pointer-events: none;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend-line {
  width: 28px;
  height: 0;
  border-top-width: 2px;
  border-top-style: solid;
}

.legend-line.data,
.legend-line.advises {
  border-top-style: dashed;
}

.legend-line.stores {
  border-top-style: dotted;
}

.tooltip {
  position: fixed;
  z-index: 10;
  display: none;
  max-width: 300px;
  padding-left: 8px;
  border-left: 2px solid var(--gold);
  color: var(--bone);
  font-size: 11px;
  line-height: 1.45;
  white-space: pre-line;
  pointer-events: none;
  text-shadow: 0 0 16px rgba(0, 0, 0, 0.95);
}

.tooltip .group {
  color: var(--mist);
}

.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  background: rgba(0, 0, 0, 0.24);
}

.drawer-backdrop.open {
  display: block;
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 21;
  width: 320px;
  max-width: calc(100vw - 32px);
  height: 100vh;
  padding: 24px 20px;
  border-left: 1px solid rgba(212, 175, 55, 0.26);
  background: rgba(8, 8, 8, 0.88);
  backdrop-filter: blur(14px);
  transform: translateX(100%);
  transition: transform 260ms cubic-bezier(0.23, 1, 0.32, 1);
}

.drawer.open {
  transform: translateX(0);
}

.drawer-id {
  margin: 0 0 12px;
  color: var(--gold);
  font-size: 22px;
  line-height: 1.05;
  word-break: break-word;
}

.drawer-badge {
  display: inline-block;
  margin-bottom: 20px;
  padding: 4px 7px;
  border: 1px solid rgba(168, 188, 198, 0.34);
  color: var(--mist);
  font-size: 10px;
  letter-spacing: 0.12em;
}

.drawer-label {
  margin: 0 0 24px;
  color: var(--bone);
  font-size: 12px;
  line-height: 1.6;
}

.drawer-heading {
  margin: 0 0 10px;
  color: var(--mist);
  font-size: 10px;
  letter-spacing: 0.14em;
}

.drawer-edges {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  color: var(--mist);
  font-size: 11px;
  line-height: 1.45;
  list-style: none;
}

.drawer-edges li {
  overflow-wrap: anywhere;
}

@keyframes criticalPulse {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 1; text-shadow: 0 0 12px rgba(201, 90, 59, 0.9); }
}

@media (max-width: 760px) {
  .bottom-strip {
    bottom: 88px;
    width: calc(100vw - 32px);
    text-align: center;
    white-space: normal;
    line-height: 1.5;
  }

  .legend {
    grid-template-columns: repeat(2, auto);
    bottom: 14px;
  }
}
</style>
</head>
<body>
<canvas id="graph" aria-label="Force-directed node graph of Yuri OS"></canvas>

<div class="brand-lockup" aria-hidden="true">
  <div class="brand-title">YURI OS</div>
  <div class="brand-subtitle">NUDIMMUD · main · 77cba552</div>
</div>

<div class="soak-status" aria-hidden="true">
  <svg class="soak-ring" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="14" fill="none" stroke="rgba(168,188,198,0.18)" stroke-width="2"></circle>
    <circle cx="16" cy="16" r="14" fill="none" stroke="#A8BCC6" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="32 68" transform="rotate(-90 16 16)"></circle>
  </svg>
  <div>16/50 SOAK</div>
  <div class="critical-pulse">5/5 ●</div>
</div>

<div class="legend" aria-hidden="true">
  <div class="legend-row"><span class="legend-line invokes" style="border-color:#D4AF37"></span><span>INVOKES</span></div>
  <div class="legend-row"><span class="legend-line data" style="border-color:#1E3A8A"></span><span>DATA</span></div>
  <div class="legend-row"><span class="legend-line advises" style="border-color:#A8BCC6"></span><span>ADVISES</span></div>
  <div class="legend-row"><span class="legend-line gates" style="border-color:#C95A3B"></span><span>GATES</span></div>
  <div class="legend-row"><span class="legend-line stores" style="border-color:#4A3B32"></span><span>STORES</span></div>
  <div class="legend-row"><span class="legend-line runs" style="border-color:#00e5bf"></span><span>RUNS</span></div>
</div>

<div class="bottom-strip" aria-hidden="true">TIER CRITICAL · PROTOCOL-CHANGE · 51 NODES · 46 EDGES</div>
<div id="tooltip" class="tooltip" role="status"></div>
<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer" aria-label="Node details" aria-hidden="true">
  <h1 id="drawerId" class="drawer-id"></h1>
  <div id="drawerBadge" class="drawer-badge"></div>
  <p id="drawerLabel" class="drawer-label"></p>
  <h2 class="drawer-heading">OUTGOING EDGES</h2>
  <ul id="drawerEdges" class="drawer-edges"></ul>
</aside>

    { source: "CLASSIFIER", target: "LANE_MINI", type: "invokes" },
    { source: "CLASSIFIER", target: "LANE_CODEX", type: "invokes" },
    { source: "CLASSIFIER", target: "LANE_SWARM", type: "invokes" },
    { source: "LANE_MINI", target: "ENKI", type: "data" },
    { source: "LANE_CODEX", target: "GATE_CODEX2", type: "gates" },
    { source: "GATE_CODEX2", target: "ENKI", type: "data" },
    { source: "MEM_HOT", target: "MEM_WARM", type: "stores" },
    { source: "MEM_WARM", target: "MEM_COLD", type: "stores" },
    { source: "MEM_COLD", target: "MEM_KERNEL", type: "stores" },
    { source: "MEM_MLM", target: "MEM_COLD", type: "stores" },
    { source: "HOOK_STARTUP", target: "ENKI", type: "invokes" },
    { source: "HOOK_PROMPT", target: "PULSE_ORCH", type: "invokes" },
    { source: "HOOK_PRE", target: "GATE_NEXUS", type: "gates" },
    { source: "HOOK_POST", target: "MEM_HOT", type: "stores" },
    { source: "HOOK_STOP", target: "EOT_PIPE", type: "invokes" },
    { source: "GATE_PRECOMMIT", target: "GATE_NEXUS", type: "gates" },
    { source: "GATE_NEXUS", target: "GATE_CODEX2", type: "gates" },
    { source: "SVC_SHELL", target: "ENKI", type: "runs" },
    { source: "SVC_RUNTIME", target: "ENKI", type: "runs" },
    { source: "SVC_RAG", target: "MEM_COLD", type: "data" },
    { source: "SVC_EOT", target: "EOT_PIPE", type: "invokes" },
    { source: "EOT_PIPE", target: "PULSE_ARCHIVE", type: "stores" },
    { source: "PULSE_ARCHIVE", target: "SOAK", type: "data" },
    { source: "SOAK", target: "CLASSIFIER", type: "data" }
  ];

  bottomStrip.textContent = `TIER CRITICAL · PROTOCOL-CHANGE · ${nodes.length} NODES · ${edges.length} EDGES`;

  let width = 0;
  let height = 0;
  let cx = 0;
  let cy = 0;
  let dpr = 1;
  let hovered = null;
  let selected = null;
  let pointer = { x: -1000, y: -1000 };
  let dashOffset = 0;
  const bootStarted = performance.now();
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function roleLine(node) {
    const parts = node.label.split("·").map(part => part.trim());
    return parts.slice(1).join(" · ");
  }

  function resize() {
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    width = window.innerWidth;
    height = window.innerHeight;
    cx = width / 2;
    cy = height / 2;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updateForces();
    simulation.alpha(0.65).restart();
  }

  nodes.forEach(node => {
    node.x = window.innerWidth / 2 + (Math.random() * 10 - 5);
    node.y = window.innerHeight / 2 + (Math.random() * 10 - 5);
  });

  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(edges).id(d => d.id).distance(d => {
      if (d.type === "invokes") return 80;
      if (d.type === "data") return 100;
      if (d.type === "advises") return 120;
      if (d.type === "gates") return 90;
      if (d.type === "stores") return 110;
      if (d.type === "runs") return 130;
      return 100;
    }).strength(0.4))
    .force("charge", d3.forceManyBody().strength(d => -Math.pow(d.r, 2) * 8))
    .force("collision", d3.forceCollide(d => d.r + 12))
    .alpha(1)
    .alphaDecay(reducedMotion ? 0.08 : 0.02);

  function scaledRadius(value) {
    const scale = Math.min(width, height) / 900;
    return value * Math.max(0.62, Math.min(1.08, scale));
  }

  function updateForces() {
    const hintScale = Math.min(width, height) * 0.46;
    simulation
      .force("center", d3.forceCenter(cx, cy).strength(0.05))
      .force("hintX", d3.forceX(d => cx + d.x_hint * hintScale).strength(0.035))
      .force("hintY", d3.forceY(d => cy + d.y_hint * hintScale).strength(0.035))
      .force("radial_nucleus", d3.forceRadial(0, cx, cy).strength(d => d.group === "nucleus" ? 1 : 0))
      .force("radial_cortex", d3.forceRadial(scaledRadius(140), cx, cy).strength(d => d.group === "cortex" ? 0.6 : 0))
      .force("radial_advisors", d3.forceRadial(scaledRadius(240), cx, cy).strength(d => d.group === "advisors" ? 0.5 : 0))
      .force("radial_memory", d3.forceRadial(scaledRadius(280), cx, cy).strength(d => d.group === "memory" ? 0.4 : 0))
      .force("radial_routing", d3.forceRadial(scaledRadius(380), cx, cy).strength(d => d.group === "routing" ? 0.4 : 0))
      .force("radial_hooks", d3.forceRadial(scaledRadius(320), cx, cy).strength(d => d.group === "hooks" ? 0.4 : 0))
      .force("radial_gates", d3.forceRadial(scaledRadius(300), cx, cy).strength(d => d.group === "gates" ? 0.4 : 0))
      .force("radial_services", d3.forceRadial(scaledRadius(440), cx, cy).strength(d => d.group === "services" ? 0.4 : 0))
      .force("radial_selfimprove", d3.forceRadial(scaledRadius(360), cx, cy).strength(d => d.group === "selfimprove" ? 0.4 : 0));
  }

  function bootOpacity(delay) {
    if (reducedMotion) return 1;
    return Math.max(0, Math.min(1, (performance.now() - bootStarted - delay) / 700));
  }

  function drawArrowhead(edge, style, opacity) {
    const sx = edge.source.x;
    const sy = edge.source.y;
    const tx = edge.target.x;
    const ty = edge.target.y;
    const angle = Math.atan2(ty - sy, tx - sx);
    const endX = tx - Math.cos(angle) * (edge.target.r + 4);
    const endY = ty - Math.sin(angle) * (edge.target.r + 4);
    const size = 5;

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.fillStyle = style.color;
    ctx.beginPath();
    ctx.moveTo(endX, endY);
    ctx.lineTo(endX - Math.cos(angle - Math.PI / 6) * size, endY - Math.sin(angle - Math.PI / 6) * size);
    ctx.lineTo(endX - Math.cos(angle + Math.PI / 6) * size, endY - Math.sin(angle + Math.PI / 6) * size);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawEdges() {
    const fade = bootOpacity(800);
    edges.forEach(edge => {
      const style = edgeStyles[edge.type];
      const opacity = style.opacity * fade * (hovered && hovered !== edge.source && hovered !== edge.target ? 0.24 : 1);
      const sx = edge.source.x;
      const sy = edge.source.y;
      const tx = edge.target.x;
      const ty = edge.target.y;
      const angle = Math.atan2(ty - sy, tx - sx);
      const endX = tx - Math.cos(angle) * (edge.target.r + 5);
      const endY = ty - Math.sin(angle) * (edge.target.r + 5);

      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.strokeStyle = style.color;
      ctx.lineWidth = style.width;
      ctx.setLineDash(style.dash);
      ctx.lineDashOffset = edge.type === "data" ? -dashOffset : 0;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.restore();

      drawArrowhead(edge, style, opacity);
    });
  }

  function drawDashedCircle(x, y, radius, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawNode(node) {
    const isHovered = hovered === node;
    const dimmed = hovered && !isHovered;
    const alpha = dimmed ? 0.3 : 1;
    const fillAlpha = isHovered ? 1 : alpha;
    const isRunningService = node.id === "SVC_SHELL" || node.id === "SVC_RUNTIME" || node.id === "SVC_RAG";

    ctx.save();
    ctx.globalAlpha = Math.min(1, fillAlpha);
    if (node.id === "ENKI") {
      ctx.shadowBlur = 30;
      ctx.shadowColor = "#D4AF37";
    } else if (node.group === "nucleus" || node.group === "cortex") {
      ctx.shadowBlur = 20;
      ctx.shadowColor = node.color;
    } else if (isRunningService) {
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#00e5bf";
    } else if (isHovered) {
      ctx.shadowBlur = 16;
      ctx.shadowColor = node.color;
    }

    ctx.fillStyle = node.color;
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(node.x, node.y, node.r + (isHovered ? 2 : 0), 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    if (node.id === "OPENCLAW") {
      ctx.save();
      ctx.globalAlpha = Math.min(1, alpha);
      drawDashedCircle(node.x, node.y, node.r + 8, "#C95A3B");
      ctx.restore();
    }

    if (selected === node) {
      ctx.save();
      ctx.strokeStyle = "rgba(212,175,55,0.72)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.r + 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawLabels() {
    const fade = bootOpacity(1200);
    nodes.forEach(node => {
      if (node.r < 9) return;
      const dimmed = hovered && hovered !== node;
      ctx.save();
      ctx.globalAlpha = fade * (dimmed ? 0.3 : 1);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "11px 'JetBrains Mono', monospace";
      ctx.fillStyle = "#F2E9D2";
      ctx.fillText(node.id, node.x, node.y + node.r + 14);

      if (node.r >= 12) {
        const role = roleLine(node);
        if (role) {
          ctx.font = "9px 'JetBrains Mono', monospace";
          ctx.fillStyle = "#A8BCC6";
          ctx.fillText(role.slice(0, 34), node.x, node.y + node.r + 26);
        }
      }
      ctx.restore();
    });
  }

  function render() {
    ctx.clearRect(0, 0, width, height);
    dashOffset += reducedMotion ? 0 : 0.3;
    drawEdges();
    nodes.forEach(drawNode);
    drawLabels();
    requestAnimationFrame(render);
  }

  function findNode(x, y) {
    for (let i = nodes.length - 1; i >= 0; i -= 1) {
      const node = nodes[i];
      const dx = x - node.x;
      const dy = y - node.y;
      if (Math.sqrt(dx * dx + dy * dy) <= node.r + 4) return node;
    }
    return null;
  }

  function setHovered(node, event) {
    hovered = node;
    canvas.style.cursor = node ? "pointer" : "default";
    if (!node) {
      tooltip.style.display = "none";
      return;
    }

    tooltip.textContent = `${node.label}\n${node.group.toUpperCase()}`;
    tooltip.style.display = "block";
    tooltip.style.left = `${Math.min(window.innerWidth - 320, event.clientX + 16)}px`;
    tooltip.style.top = `${Math.min(window.innerHeight - 80, event.clientY + 16)}px`;
  }

  function openDrawer(node) {
    selected = node;
    drawerId.textContent = node.id;
    drawerBadge.textContent = node.group.toUpperCase();
    drawerLabel.textContent = node.label;
    drawerEdges.innerHTML = "";

    const outgoing = edges.filter(edge => edge.source.id === node.id || edge.source === node.id);
    if (!outgoing.length) {
      const li = document.createElement("li");
      li.textContent = "No outgoing edges";
      drawerEdges.appendChild(li);
    } else {
      outgoing.forEach(edge => {
        const li = document.createElement("li");
        li.textContent = `→ ${edge.target.id || edge.target} (${edge.type})`;
        drawerEdges.appendChild(li);
      });
    }

    drawer.classList.add("open");
    drawerBackdrop.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
  }

  function closeDrawer() {
    selected = null;
    drawer.classList.remove("open");
    drawerBackdrop.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
  }

  canvas.addEventListener("mousemove", event => {
    pointer = { x: event.clientX, y: event.clientY };
    setHovered(findNode(pointer.x, pointer.y), event);
  });

  canvas.addEventListener("mouseleave", () => {
    pointer = { x: -1000, y: -1000 };
    setHovered(null);
  });

  canvas.addEventListener("click", event => {
    const node = findNode(event.clientX, event.clientY);
    if (node) openDrawer(node);
  });

  drawerBackdrop.addEventListener("click", closeDrawer);
  window.addEventListener("keydown", event => {
    if (event.key === "Escape") closeDrawer();
  });
  window.addEventListener("resize", resize);

  resize();
  render();
})();
</script>
</body>
</html>
