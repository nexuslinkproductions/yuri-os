<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YURI OS · Fixed Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b18;
  --bg-soft: #0d1526;
  --cyan: #00d4ff;
  --blue: #4a9eff;
  --violet: #9b6eff;
  --red-hot: #ff5252;
  --emerald: #00c896;
  --amber: #ffb347;
  --ice: #74b9ff;
  --flame: #ff6835;
  --slate: #94a3b8;
  --text: #c8d8e8;
  --text-dim: #5a7090;
  --text-faint: #2a4060;
  --card-border: rgba(148, 163, 184, 0.22);
  --card-fill: rgba(10, 16, 31, 0.84);
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "JetBrains Mono", monospace;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

body {
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 10%, rgba(0, 212, 255, 0.06), transparent 25%),
    radial-gradient(circle at 50% 92%, rgba(74, 158, 255, 0.04), transparent 28%),
    repeating-linear-gradient(
      0deg,
      rgba(200, 216, 232, 0.018) 0,
      rgba(200, 216, 232, 0.018) 1px,
      transparent 1px,
      transparent 5px
    );
  opacity: 1;
}

#viewport {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 50% 10%, rgba(0, 212, 255, 0.06), transparent 24%),
    radial-gradient(circle at 50% 86%, rgba(74, 158, 255, 0.04), transparent 28%),
    linear-gradient(180deg, rgba(13, 21, 38, 0.64), rgba(7, 11, 24, 0.96));
}

#stage {
  position: relative;
  width: 100%;
  height: 2100px;
}

canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 2100px;
}

#bgCanvas {
  z-index: 0;
  pointer-events: none;
}

#mainCanvas {
  z-index: 1;
  cursor: default;
}

.info-card {
  position: fixed;
  z-index: 120;
  display: none;
  width: min(360px, calc(100vw - 24px));
  padding: 14px 14px 12px;
  border: 1px solid var(--card-border);
  border-radius: 18px;
  background:
    radial-gradient(circle at 20% 0%, rgba(0, 212, 255, 0.12), transparent 36%),
    linear-gradient(180deg, rgba(13, 21, 38, 0.94), rgba(7, 11, 24, 0.88));
  box-shadow:
    0 24px 60px rgba(0, 0, 0, 0.42),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(18px) saturate(120%);
  color: var(--text);
}

.info-card[data-side="right"]::before,
.info-card[data-side="left"]::before {
  content: "";
  position: absolute;
  top: 28px;
  width: 0;
  height: 0;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
}

.info-card[data-side="right"]::before {
  left: -10px;
  border-right: 10px solid rgba(148, 163, 184, 0.4);
}

.info-card[data-side="left"]::before {
  right: -10px;
  border-left: 10px solid rgba(148, 163, 184, 0.4);
}

.info-close {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 999px;
  background: rgba(200, 216, 232, 0.06);
  color: var(--text-dim);
  font: inherit;
  line-height: 1;
  cursor: pointer;
}

.info-kicker {
  margin-bottom: 4px;
  color: var(--cyan);
  font-size: 9px;
  line-height: 1.2;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.info-card h1 {
  margin: 0 0 6px;
  color: var(--text);
  font-size: 20px;
  line-height: 1.1;
  letter-spacing: 0.03em;
}

.info-role {
  margin: 0 0 8px;
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.45;
}

.info-detail {
  margin: 0 0 12px;
  color: var(--text-faint);
  font-size: 11px;
  line-height: 1.45;
}

.info-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  color: var(--slate);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.info-grid h2 {
  margin: 0 0 8px;
  color: var(--text-dim);
  font-size: 9px;
  letter-spacing: 0.16em;
}

.info-list {
  display: grid;
  gap: 6px;
}

.info-item {
  padding: 7px 8px;
  border: 1px solid rgba(148, 163, 184, 0.14);
  border-radius: 12px;
  background: rgba(200, 216, 232, 0.04);
}

.info-line {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  font-size: 11px;
  line-height: 1.35;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 6px;
  border: 1px solid currentColor;
  border-radius: 999px;
  font-size: 8px;
  line-height: 1;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
}

.badge.flow { color: var(--cyan); }
.badge.branch { color: var(--blue); }
.badge.data { color: var(--blue); }
.badge.advises { color: var(--violet); }
.badge.gates { color: var(--flame); }
.badge.memory { color: var(--ice); }

@media (max-width: 760px) {
  .info-card {
    width: min(340px, calc(100vw - 16px));
    padding: 12px;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<div id="viewport">

</div>

  <div id="infoKicker" class="info-kicker"></div>

    { source: "CODEX_GATE", target: "APPROVED", type: "branch" },
    { source: "CODEX_GATE", target: "APPLY", type: "branch" },

    { source: "MEMORY", target: "MEM_HOT", type: "branch" },
    { source: "MEMORY", target: "MEM_WARM", type: "branch" },
    { source: "MEMORY", target: "MEM_COLD", type: "branch" },
    { source: "MEMORY", target: "MEM_KERNEL", type: "branch" },
    { source: "MEMORY", target: "MLM_SANDBOX", type: "branch" },

    { source: "SERVICES", target: "SVC_SHELL", type: "branch" },
    { source: "SERVICES", target: "SVC_RUNTIME", type: "branch" },
    { source: "SERVICES", target: "SVC_RAG", type: "branch" },
    { source: "SERVICES", target: "SVC_HEALTH", type: "branch" },
    { source: "SERVICES", target: "SVC_EOT", type: "branch" },

    { source: "DEEPSEEK_A", target: "PULSE_BUS", type: "data" },
    { source: "OPENCLAW_A", target: "PULSE_BUS", type: "data" },
    { source: "HERMES_A", target: "PULSE_BUS", type: "data" },
    { source: "CASSANDRA_A", target: "PULSE_BUS", type: "data" },
    { source: "SWARM_A", target: "PULSE_BUS", type: "data" },
    { source: "OBLITERATUS_A", target: "PULSE_BUS", type: "data" },
    { source: "PULSE_PLAN", target: "ENKI", type: "data" },
    { source: "MEM_HOT", target: "ENKI_DEC", type: "data" },
    { source: "SERVICES", target: "ENKI", type: "data" },

    { source: "ADVISORS", target: "DEEPSEEK_A", type: "advises" },
    { source: "ADVISORS", target: "OPENCLAW_A", type: "advises" },
    { source: "ADVISORS", target: "HERMES_A", type: "advises" },
    { source: "ADVISORS", target: "CASSANDRA_A", type: "advises" },
    { source: "ADVISORS", target: "SWARM_A", type: "advises" },
    { source: "ADVISORS", target: "OBLITERATUS_A", type: "advises" },

    { source: "ROUTING", target: "MEMORY", type: "memory" },

    { source: "ENKI_DEC", target: "CODEX_GATE", type: "gates" },
    { source: "PROPOSE", target: "APPROVED", type: "gates" },
    { source: "APPROVED", target: "APPLY", type: "gates" },
    { source: "LANE_MINI", target: "CODEX_GATE", type: "gates" },
    { source: "LANE_CODEX", target: "CODEX_GATE", type: "gates" }
  ];

  const flowPathIds = [
    "USER",
    "USER_INPUT",
    "ENKI",
    "SESSION_INIT",
    "PROMPT_HOOKS",
    "NEXUSPULSE",
    "CLASSIFIER",
    "ADVISORS",
    "PULSE_BUS",
    "ENKI_DEC",
    "ROUTING",
    "RESPONSE"
  ];

  let viewportWidth = window.innerWidth;
  let viewportHeight = TRACK_HEIGHT;
  let cx = viewportWidth / 2;
  let flowTrack = { segments: [], total: 0 };
  let selectedNode = null;
  let hoverNode = null;
  let dpr = 1;

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function rgba(hex, alpha) {
    const value = hex.replace("#", "");
    const normalized = value.length === 3 ? value.split("").map((ch) => ch + ch).join("") : value;
    const parsed = Number.parseInt(normalized, 16);
    const r = (parsed >> 16) & 255;
    const g = (parsed >> 8) & 255;
    const b = parsed & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function syncLayout() {
    viewportWidth = window.innerWidth;
    viewportHeight = TRACK_HEIGHT;
    cx = viewportWidth / 2;

    for (const node of sections) {
      node.x = cx;
      node.y = node.baseY;
    }

    for (const node of subs) {
      node.x = cx + node.xOffset;
      node.y = node.baseY;
    }

    for (const node of microNodes) {
      node.x = cx + (node.xOffset || 0);
      node.y = node.baseY;
    }

    nodeMap.clear();
    for (const node of nodes) nodeMap.set(node.id, node);

    incomingByNode.clear();
    outgoingByNode.clear();
    for (const edge of edges) {
      if (!outgoingByNode.has(edge.source)) outgoingByNode.set(edge.source, []);
      if (!incomingByNode.has(edge.target)) incomingByNode.set(edge.target, []);
      outgoingByNode.get(edge.source).push(edge);
      incomingByNode.get(edge.target).push(edge);
    }

    flowTrack = buildFlowTrack();
  }

  function resizeCanvas(canvas, context) {
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(viewportWidth * dpr);
    canvas.height = Math.floor(viewportHeight * dpr);
    canvas.style.width = `${viewportWidth}px`;
    canvas.style.height = `${viewportHeight}px`;
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawBackgroundLayer() {
    const width = viewportWidth;
    const height = viewportHeight;
    bgCtx.clearRect(0, 0, width, height);
    bgCtx.fillStyle = "#070B18";
    bgCtx.fillRect(0, 0, width, height);

    const topGlow = bgCtx.createRadialGradient(width / 2, 60, 40, width / 2, 60, width * 0.55);
    topGlow.addColorStop(0, "rgba(0, 212, 255, 0.09)");
    topGlow.addColorStop(0.25, "rgba(0, 212, 255, 0.05)");
    topGlow.addColorStop(1, "rgba(0, 212, 255, 0)");
    bgCtx.fillStyle = topGlow;
    bgCtx.fillRect(0, 0, width, height);

    const bottomGlow = bgCtx.createRadialGradient(width / 2, height - 100, 40, width / 2, height - 100, width * 0.5);
    bottomGlow.addColorStop(0, "rgba(74, 158, 255, 0.07)");
    bottomGlow.addColorStop(0.3, "rgba(74, 158, 255, 0.03)");
    bottomGlow.addColorStop(1, "rgba(74, 158, 255, 0)");
    bgCtx.fillStyle = bottomGlow;
    bgCtx.fillRect(0, 0, width, height);

    const centerGlow = bgCtx.createLinearGradient(width / 2 - 220, 0, width / 2 + 220, 0);
    centerGlow.addColorStop(0, "rgba(0, 212, 255, 0)");
    centerGlow.addColorStop(0.5, "rgba(74, 158, 255, 0.07)");
    centerGlow.addColorStop(1, "rgba(0, 212, 255, 0)");
    bgCtx.fillStyle = centerGlow;
    bgCtx.fillRect(0, 0, width, height);
  }

  function fitFont(base, radius, min) {
    return `${Math.max(min, Math.round(base * (radius / 52)))}px JetBrains Mono, monospace`;
  }

  function drawGlassOrb(node, hovered = false) {
    const { x, y, r, color, tier } = node;
    const glow = tier === "section" ? 24 : 10;
    const fill = ctx.createRadialGradient(x - r * 0.32, y - r * 0.36, r * 0.08, x, y, r);
    fill.addColorStop(0, rgba(color, 0.38));
    fill.addColorStop(0.35, rgba(color, 0.1));
    fill.addColorStop(0.8, rgba(color, 0.16));
    fill.addColorStop(1, rgba(color, 0.32));

    ctx.save();
    ctx.shadowBlur = glow + (hovered ? 6 : 0);
    ctx.shadowColor = color;
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = rgba(color, 0.72);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();

    const hl = ctx.createRadialGradient(x - r * 0.36, y - r * 0.38, 0, x - r * 0.36, y - r * 0.38, r * 0.68);
    hl.addColorStop(0, "rgba(255,255,255,0.26)");
    hl.addColorStop(0.55, "rgba(255,255,255,0.05)");
    hl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = hl;
    ctx.beginPath();
    ctx.arc(x, y, r - 1, 0, Math.PI * 2);
    ctx.fill();

    if (node.id === "OPENCLAW_A") {
      ctx.save();
      ctx.strokeStyle = "rgba(255, 82, 82, 0.5)";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(x, y, r + 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowBlur = 0;

    if (node.tier === "section") {
      const scale = node.r < 45 ? 0.92 : 1;
      const idFont = fitFont(13 * scale, node.r, 11);
      const roleFont = fitFont(10 * scale, node.r, 9);
      const detailFont = fitFont(8 * scale, node.r, 8);

      ctx.fillStyle = "#C8D8E8";
      ctx.font = `700 ${idFont}`;
      ctx.fillText(node.label, x, y - 8);

      ctx.font = roleFont;
      ctx.fillStyle = "#5A7090";
      ctx.fillText(node.role, x, y + 7);

      if (node.detail) {
        ctx.font = detailFont;
        ctx.fillStyle = "#2A4060";
        ctx.fillText(node.detail, x, y + 20);
      }
    } else if (node.tier === "sub") {
      ctx.fillStyle = "#C8D8E8";
      ctx.font = "10px JetBrains Mono, monospace";
      ctx.fillText(node.label, x, y - 5);
      ctx.font = "8px JetBrains Mono, monospace";
      ctx.fillStyle = "#3A5070";
      ctx.fillText(node.type, x, y + 7);
    } else if (node.tier === "micro") {
      ctx.fillStyle = "#4A6080";
      ctx.font = "8px JetBrains Mono, monospace";
      ctx.fillText(node.label, x, y - (r + 10));
    }

    ctx.restore();
  }

  function bezierForEdge(edge, source, target) {
    const dx = target.x - source.x;
    const dy = target.y - source.y;

    if (edge.type === "flow") {
      return {
        c1x: source.x,
        c1y: source.y + dy * 0.45,
        c2x: target.x,
        c2y: target.y - dy * 0.45
      };
    }

    if (edge.type === "branch") {
      return {
        c1x: source.x,
        c1y: source.y + dy * 0.3,
        c2x: target.x,
        c2y: target.y - dy * 0.3
      };
    }

    if (edge.type === "memory") {
      const bend = Math.max(70, Math.abs(dx) * 0.28);
      return {
        c1x: source.x - bend * 0.15,
        c1y: source.y + dy * 0.22,
        c2x: target.x - bend * 0.2,
        c2y: target.y - dy * 0.22
      };
    }

    if (edge.type === "gates") {
      const bend = Math.max(90, Math.abs(dx) * 0.45);
      return {
        c1x: source.x + bend,
        c1y: source.y + dy * 0.18,
        c2x: target.x + bend,
        c2y: target.y - dy * 0.18
      };
    }

    const bend = Math.max(60, Math.abs(dx) * 0.18);
    return {
      c1x: source.x + dx * 0.15 - bend * 0.08,
      c1y: source.y + dy * 0.24,
      c2x: target.x - dx * 0.15 - bend * 0.08,
      c2y: target.y - dy * 0.24
    };
  }

  function drawEdge(edge, time) {
    const source = nodeMap.get(edge.source);
    const target = nodeMap.get(edge.target);
    if (!source || !target) return;

    const style = edgeStyles[edge.type];
    const controls = bezierForEdge(edge, source, target);

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(source.x, source.y);
    ctx.bezierCurveTo(controls.c1x, controls.c1y, controls.c2x, controls.c2y, target.x, target.y);
    ctx.strokeStyle = style.stroke;
    ctx.lineWidth = style.width;
    ctx.globalAlpha = style.opacity;
    ctx.lineCap = "round";
    if (style.dash.length) {
      ctx.setLineDash(style.dash);
      ctx.lineDashOffset = -time * (edge.type === "data" ? 0.03 : edge.type === "memory" ? 0.02 : 0.025);
    } else {
      ctx.setLineDash([]);
    }
    ctx.shadowBlur = edge.type === "flow" ? 9 : 5;
    ctx.shadowColor = style.stroke;
    ctx.stroke();
    ctx.restore();
  }

  function buildFlowTrack() {
    const points = flowPathIds.map((id) => nodeMap.get(id)).filter(Boolean);
    const segments = [];
    let total = 0;

    for (let index = 0; index < points.length - 1; index += 1) {
      const a = points[index];
      const b = points[index + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      segments.push({ a, b, len, start: total, end: total + len });
      total += len;
    }

    return { points, segments, total };
  }

  function sampleFlowPoint(flowT) {
    if (!flowTrack.segments.length || flowTrack.total <= 0) return null;
    const distance = flowT * flowTrack.total;
    const segment = flowTrack.segments.find((entry) => distance >= entry.start && distance <= entry.end) || flowTrack.segments[flowTrack.segments.length - 1];
    if (!segment) return null;
    const span = segment.end - segment.start || 1;
    const local = clamp((distance - segment.start) / span, 0, 1);
    return {
      x: segment.a.x + (segment.b.x - segment.a.x) * local,
      y: segment.a.y + (segment.b.y - segment.a.y) * local
    };
  }

  function drawFlowPulse(time) {
    const flowT = (time % 5000) / 5000;
    const point = sampleFlowPoint(flowT);
    if (!point) return;

    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00D4FF";
    ctx.fillStyle = "#00D4FF";
    ctx.beginPath();
    ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawSpineGuide() {
    ctx.save();
    ctx.strokeStyle = "rgba(42, 64, 96, 0.5)";
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 9]);
    ctx.beginPath();
    ctx.moveTo(cx, 60);
    ctx.lineTo(cx, TRACK_HEIGHT - 60);
    ctx.stroke();
    ctx.restore();
  }

  function drawStageLabels() {
    ctx.save();
    ctx.fillStyle = "#2A4060";
    ctx.font = "9px JetBrains Mono, monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    for (const row of stageRows) {
      ctx.fillText(row.label, 24, row.y);
    }
    ctx.restore();
  }

  function drawEdges(time) {
    const order = ["memory", "advises", "data", "branch", "gates", "flow"];
    for (const type of order) {
      for (const edge of edges) {
        if (edge.type === type) drawEdge(edge, time);
      }
    }
  }

  function drawNodes() {
    for (const node of sections) drawGlassOrb(node, node === hoverNode);
    for (const node of subs) drawGlassOrb(node, node === hoverNode);
    for (const node of microNodes) drawGlassOrb(node, node === hoverNode);
  }

  function renderMain() {
    const width = viewportWidth;
    const height = viewportHeight;
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#070B18";
    ctx.fillRect(0, 0, width, height);

    const time = Date.now();
    drawSpineGuide();
    drawStageLabels();
    drawEdges(time);
    drawNodes();
    drawFlowPulse(time);
  }

  function renderFrame() {
    renderMain();
    requestAnimationFrame(renderFrame);
  }

  function canvasPointFromEvent(event) {
    const rect = mainCanvas.getBoundingClientRect();
    return {
      x: event.clientX - rect.left,
      y: event.clientY - rect.top + viewport.scrollTop
    };
  }

  function hitTest(x, y) {
    for (let index = nodes.length - 1; index >= 0; index -= 1) {
      const node = nodes[index];
      if (Math.hypot(node.x - x, node.y - y) <= node.r + 7) return node;
    }
    return null;
  }

  function buildConnectionItem(edge, otherNodeId) {
    const node = nodeMap.get(otherNodeId);
    const title = node ? node.label : otherNodeId;
    const badgeLabel = edge.type === "flow"
      ? "FLOW"
      : edge.type === "branch"
        ? "BRANCH"
        : edge.type === "data"
          ? "DATA"
          : edge.type === "advises"
            ? "ADVISES"
            : edge.type === "gates"
              ? "GATES"
              : "MEMORY";

    const item = document.createElement("div");
    item.className = "info-item";

    const line = document.createElement("div");
    line.className = "info-line";

    const badge = document.createElement("span");
    badge.className = `badge ${edge.type}`;
    badge.textContent = badgeLabel;

    const text = document.createElement("strong");
    text.textContent = title;

    line.append(badge, text);
    item.append(line);
    return item;
  }

  function populateInfoCard(node) {
    const incoming = incomingByNode.get(node.id) || [];
    const outgoing = outgoingByNode.get(node.id) || [];

    infoKicker.textContent = "NODE FOCUS";
    infoId.textContent = node.label;
    infoRole.textContent = node.role || "";
    infoDetail.textContent = node.detail || "";
    infoStage.textContent = node.tier === "section" ? node.stage : `PARENT ${node.parent}`;
    infoTier.textContent = node.tier.toUpperCase();

    infoIncoming.replaceChildren(
      ...(incoming.length
        ? incoming.map((edge) => buildConnectionItem(edge, edge.source))
        : [Object.assign(document.createElement("div"), { className: "info-item", textContent: "No incoming links" })])
    );

    infoOutgoing.replaceChildren(
      ...(outgoing.length
        ? outgoing.map((edge) => buildConnectionItem(edge, edge.target))
        : [Object.assign(document.createElement("div"), { className: "info-item", textContent: "No outgoing links" })])
    );
  }

  function positionInfoCard(node) {
    if (!node) return;
    const cardWidth = infoCard.offsetWidth || 320;
    const cardHeight = infoCard.offsetHeight || 240;
    const screenX = node.x;
    const screenY = node.y - viewport.scrollTop;
    const openRight = screenX < viewportWidth * 0.58;
    const side = openRight ? "right" : "left";
    let left = openRight ? screenX + node.r + 22 : screenX - cardWidth - node.r - 22;
    let top = screenY - cardHeight * 0.18;

    left = clamp(left, 12, viewportWidth - cardWidth - 12);
    top = clamp(top, 12, window.innerHeight - cardHeight - 12);

    infoCard.dataset.side = side;
    infoCard.style.left = `${left}px`;
    infoCard.style.top = `${top}px`;
  }

  function showInfoCard(node) {
    selectedNode = node;
    populateInfoCard(node);
    infoCard.style.display = "block";
    infoCard.setAttribute("aria-hidden", "false");
    positionInfoCard(node);
  }

  function hideInfoCard() {
    selectedNode = null;
    infoCard.style.display = "none";
    infoCard.setAttribute("aria-hidden", "true");
  }

  function updateHover(node) {
    hoverNode = node;
    mainCanvas.style.cursor = node ? "pointer" : "default";
  }

  function resize() {
    viewportWidth = window.innerWidth;
    viewportHeight = TRACK_HEIGHT;
    syncLayout();
    resizeCanvas(bgCanvas, bgCtx);
    resizeCanvas(mainCanvas, ctx);
    drawBackgroundLayer();
    if (selectedNode) positionInfoCard(selectedNode);
  }

  mainCanvas.addEventListener("pointermove", (event) => {
    const point = canvasPointFromEvent(event);
    updateHover(hitTest(point.x, point.y));
  });

  mainCanvas.addEventListener("pointerleave", () => {
    updateHover(null);
  });

  mainCanvas.addEventListener("pointerdown", (event) => {
    const point = canvasPointFromEvent(event);
    const node = hitTest(point.x, point.y);
    if (node) {
      showInfoCard(node);
      event.preventDefault();
      return;
    }

    hideInfoCard();
  });

  infoClose.addEventListener("click", hideInfoCard);

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") hideInfoCard();
  });

  viewport.addEventListener("scroll", () => {
    if (selectedNode) positionInfoCard(selectedNode);
  }, { passive: true });

  window.addEventListener("resize", resize);

  syncLayout();
  resize();
  renderFrame();
})();
</script>
</body>
</html>
