<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YURI OS · Force Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070B18;
  --surface: #0D1526;
  --cyan: #00D4FF;
  --blue: #4A9EFF;
  --violet: #9B6EFF;
  --red-hot: #FF5252;
  --emerald: #00C896;
  --amber: #FFB347;
  --ice: #74B9FF;
  --flame: #FF6835;
  --slate: #94A3B8;
  --text: #C8D8E8;
  --text-dim: #5A7090;
  --text-faint: #2A4060;
  --edge-flow: #00D4FF;
  --edge-data: #4A9EFF;
  --edge-gate: #FF6835;
  --edge-mem: #74B9FF;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  background: var(--bg);
  overflow: hidden;
  font-family: "JetBrains Mono", monospace;
  color: var(--text);
}

body {
  position: relative;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 10%, rgba(0, 212, 255, 0.08), transparent 30%),
    radial-gradient(circle at 50% 90%, rgba(74, 158, 255, 0.06), transparent 26%),
    repeating-linear-gradient(
      0deg,
      rgba(200, 216, 232, 0.032) 0,
      rgba(200, 216, 232, 0.032) 1px,
      transparent 1px,
      transparent 5px
    );
  opacity: 0.5;
}

#viewport {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow-y: auto;
  overflow-x: hidden;
  height: 100vh;
  background:
    radial-gradient(circle at 50% 12%, rgba(0, 212, 255, 0.08), transparent 22%),
    radial-gradient(circle at 50% 88%, rgba(74, 158, 255, 0.05), transparent 28%),
    linear-gradient(180deg, rgba(13, 21, 38, 0.62), rgba(7, 11, 24, 0.94));
}

canvas {
  display: block;
  width: 100vw;
  height: 1600px;
}

.hud {
  position: fixed;
  z-index: 100;
  pointer-events: none;
}

.hud-left {
  top: 14px;
  left: 18px;
  display: grid;
  gap: 2px;
}

.brand-title {
  color: var(--cyan);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1.1;
}

.brand-subtitle {
  color: var(--text-faint);
  font-size: 10px;
  line-height: 1.2;
}

.hud-right {
  top: 12px;
  right: 16px;
  display: grid;
  grid-template-columns: 32px auto;
  align-items: center;
  column-gap: 8px;
  row-gap: 2px;
  color: var(--text-dim);
  font-size: 10px;
  line-height: 1.1;
}

.soak-ring {
  grid-row: 1 / 3;
  width: 32px;
  height: 32px;
}

.soak-ring circle:last-child {
  animation: ringPulse 2.4s ease-in-out infinite;
}

.critical-pulse {
  color: var(--red-hot);
  animation: criticalPulse 1.35s ease-in-out infinite;
}

.hud-bottom {
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  color: var(--text-faint);
  font-size: 10px;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.legend {
  position: fixed;
  left: 16px;
  bottom: 14px;
  z-index: 100;
  display: grid;
  gap: 6px;
  color: var(--text-dim);
  font-size: 9px;
  letter-spacing: 0.08em;
  pointer-events: none;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend-line {
  width: 28px;
  height: 0;
  border-top-width: 2px;
  border-top-style: solid;
}

.legend-line.data {
  border-top-style: dashed;
}

.legend-line.gates {
  border-top-style: solid;
}

.legend-line.memory {
  border-top-style: dotted;
}

.tooltip {
  position: fixed;
  z-index: 120;
  display: none;
  min-width: 160px;
  max-width: 320px;
  padding: 8px 10px 8px 9px;
  border-left: 2px solid var(--cyan);
  background: rgba(13, 21, 38, 0.96);
  color: var(--text);
  font-size: 11px;
  line-height: 1.45;
  white-space: pre-line;
  pointer-events: none;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
}

.tooltip strong {
  color: var(--text);
}

.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 130;
  display: none;
  background: rgba(3, 6, 14, 0.42);
}

.drawer-backdrop.open {
  display: block;
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  z-index: 140;
  width: 320px;
  max-width: calc(100vw - 20px);
  height: 100vh;
  padding: 24px 18px 24px 20px;
  border-left: 1px solid rgba(74, 158, 255, 0.18);
  background: linear-gradient(180deg, rgba(13, 21, 38, 0.98), rgba(7, 11, 24, 0.96));
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 24px), calc(100% - 16px) 100%, 0 100%);
  transform: translateX(100%);
  transition: transform 280ms cubic-bezier(0.23, 1, 0.32, 1);
  backdrop-filter: blur(16px);
  overflow-y: auto;
}

.drawer.open {
  transform: translateX(0);
}

.drawer-id {
  margin: 0 0 8px;
  color: var(--cyan);
  font-size: 24px;
  line-height: 1.05;
  letter-spacing: 0.02em;
}

.drawer-role {
  margin: 0 0 8px;
  color: var(--text);
  font-size: 13px;
  line-height: 1.45;
}

.drawer-detail {
  margin: 0 0 18px;
  color: var(--text-dim);
  font-size: 11px;
  line-height: 1.5;
}

.drawer-section {
  margin-top: 18px;
}

.drawer-heading {
  margin: 0 0 10px;
  color: var(--text-dim);
  font-size: 10px;
  letter-spacing: 0.14em;
}

.drawer-list {
  display: grid;
  gap: 8px;
}

.drawer-item {
  display: grid;
  gap: 4px;
  padding: 8px 10px;
  border: 1px solid rgba(148, 163, 184, 0.12);
  background: rgba(13, 21, 38, 0.72);
}

.drawer-line {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  color: var(--text);
  font-size: 11px;
  line-height: 1.45;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 6px;
  border: 1px solid currentColor;
  font-size: 9px;
  line-height: 1;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
}

.badge.flow {
  color: var(--cyan);
}

.badge.data {
  color: var(--blue);
}

.badge.advises {
  color: var(--violet);
}

.badge.gates {
  color: var(--flame);
}

.badge.memory {
  color: var(--ice);
}

.badge.service {
  color: var(--emerald);
}

.badge.quarantine {
  color: var(--red-hot);
}

.node-id-label {
  position: fixed;
  z-index: 90;
  display: none;
}

@keyframes criticalPulse {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 1; text-shadow: 0 0 12px rgba(255, 82, 82, 0.9); }
}

@keyframes ringPulse {
  0%, 100% { opacity: 0.75; }
  50% { opacity: 1; }
}

@media (max-width: 760px) {
  .hud-bottom {
    bottom: 88px;
    width: calc(100vw - 32px);
    text-align: center;
    white-space: normal;
    line-height: 1.5;
  }

  .legend {
    grid-template-columns: repeat(2, auto);
    bottom: 14px;
  }

  .drawer {
    width: min(92vw, 320px);
  }
}
</style>
</head>
<body>
<div id="viewport">
  <canvas id="graph" aria-label="Top-down force graph of Yuri OS"></canvas>
</div>

<div class="hud hud-left" aria-hidden="true">
  <div class="brand-title">YURI OS</div>
  <div class="brand-subtitle">NUDIMMUD · main · f770a64b</div>
</div>

<div class="hud hud-right" aria-hidden="true">
  <svg class="soak-ring" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="12" fill="none" stroke="rgba(90,112,144,0.24)" stroke-width="2"></circle>
    <circle cx="16" cy="16" r="12" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="32 68" transform="rotate(-90 16 16)"></circle>
  </svg>
  <div>16/50 SOAK</div>
  <div class="critical-pulse">5/5 ●</div>
</div>

<div class="hud hud-bottom" aria-hidden="true">TIER CRITICAL · PROTOCOL-CHANGE · 30 NODES · 40 EDGES</div>

<div class="legend" aria-hidden="true">
  <div class="legend-row"><span class="legend-line" style="border-color:#00D4FF"></span><span>FLOW</span></div>
  <div class="legend-row"><span class="legend-line data" style="border-color:#4A9EFF"></span><span>DATA</span></div>
  <div class="legend-row"><span class="legend-line gates" style="border-color:#FF6835"></span><span>GATES</span></div>
  <div class="legend-row"><span class="legend-line memory" style="border-color:#74B9FF"></span><span>MEMORY</span></div>
</div>

<div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>
<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer" aria-label="Node details" aria-hidden="true">
  <h1 id="drawerId" class="drawer-id"></h1>
  <p id="drawerRole" class="drawer-role"></p>
  <p id="drawerDetail" class="drawer-detail"></p>
  <div class="drawer-section">
    <h2 class="drawer-heading">INCOMING</h2>
    <div id="drawerIncoming" class="drawer-list"></div>
  </div>
  <div class="drawer-section">
    <h2 class="drawer-heading">OUTGOING</h2>
    <div id="drawerOutgoing" class="drawer-list"></div>
  </div>
</aside>

    { id: "CLASSIFIER", label: "CLASSIFIER", role: "offload-contract.mjs", detail: "tier: TRIVIAL/STD/CPLX/CRIT", layer: 6, r: 42, color: "#4A9EFF" },
    { id: "DEEPSEEK", label: "DEEPSEEK", role: "model_advisor", detail: "v4-flash / v4-pro · 60s", layer: 7, r: 36, color: "#9B6EFF" },
    { id: "OPENCLAW", label: "OPENCLAW", role: "bridge_advisory", detail: "QUARANTINED · HIGH cap", layer: 7, r: 36, color: "#FF5252" },
    { id: "HERMES_FC", label: "HERMES", role: "native_function", detail: "context pressure · always-on", layer: 7, r: 34, color: "#9B6EFF" },
    { id: "CASSANDRA", label: "CASSANDRA", role: "native foresight", detail: "strategic · no model", layer: 7, r: 34, color: "#9B6EFF" },
    { id: "SWARM", label: "SWARM", role: "swarm_dispatch", detail: "flash+pro parallel", layer: 7, r: 34, color: "#9B6EFF" },
    { id: "OBLITERATUS", label: "OBLITERATUS", role: "adversarial gate", detail: "critical turns only", layer: 7, r: 34, color: "#FF6835" },
    { id: "PULSE_BUS", label: "PULSE BUS", role: "ring buffer · 14 slots", detail: "5min TTL · findings", layer: 8, r: 42, color: "#4A9EFF" },
    { id: "ENKI_DECISION", label: "ENKI DECIDES", role: "synthesizes findings", detail: "reads bus → routes → acts", layer: 9, r: 48, color: "#00D4FF" },
    { id: "LANE_LOCAL", label: "code-local", role: "qwen2.5-coder:7b", detail: "LOCAL", layer: 10, r: 28, color: "#00C896" },
    { id: "LANE_DSFLASH", label: "ds-flash", role: "deepseek-v4-flash", detail: "CLOUD", layer: 10, r: 28, color: "#00C896" },
    { id: "LANE_MINI", label: "codex-mini", role: "gpt-5.4-mini", detail: "CODEX · impl", layer: 10, r: 30, color: "#9B6EFF" },
    { id: "LANE_CODEX", label: "codex", role: "gpt-5.5", detail: "CODEX · full", layer: 10, r: 32, color: "#9B6EFF" },
    { id: "GATE_CODEX2", label: "CODEX GATE", role: "two-phase · propose", detail: "→ .approved → apply", layer: 10, r: 36, color: "#FF6835" },
    { id: "GATE_NEXUS", label: "GITNEXUS", role: "impact analysis", detail: "blast radius check", layer: 10, r: 30, color: "#FF6835" },
    { id: "MEM_HOT", label: "MEM HOT", role: "TIER 1 · in-context", detail: "pulse-plan + bus", layer: 11, r: 36, color: "#FF6B6B" },
    { id: "MEM_WARM", label: "MEM WARM", role: "TIER 2 · episodic", detail: "EOT + journal", layer: 11, r: 34, color: "#FFB347" },
    { id: "MEM_COLD", label: "MEM COLD", role: "TIER 3 · semantic", detail: "wiki atoms", layer: 11, r: 32, color: "#74B9FF" },
    { id: "MEM_KERNEL", label: "KERNEL DB", role: "memory.db · SQLite", detail: "kernel.py syscalls", layer: 11, r: 30, color: "#94A3B8" },
    { id: "SVC_SHELL", label: "shellservice", role: "PID 816 · port 3098", detail: "RUNNING", layer: 12, r: 28, color: "#00C896" },
    { id: "SVC_RUNTIME", label: "yuri-runtime", role: "PID 819", detail: "RUNNING", layer: 12, r: 28, color: "#00C896" },
    { id: "SVC_RAG", label: "wiki-rag", role: "PID 821 · RAG", detail: "RUNNING", layer: 12, r: 28, color: "#00C896" },
    { id: "SVC_EOT", label: "eot-refresh", role: "launchd scheduled", detail: "eot-archive.mjs", layer: 12, r: 26, color: "#94A3B8" },
    { id: "RESPONSE", label: "RESPONSE", role: "output to user", detail: "→ USER sees result", layer: 13, r: 44, color: "#00D4FF" }
  ];

  const links = [
    { source: "USER", target: "USER_INPUT", type: "flow" },
    { source: "USER_INPUT", target: "ENKI", type: "flow" },
    { source: "ENKI", target: "PULSE_SEED", type: "flow" },
    { source: "PULSE_SEED", target: "ENKI", type: "data" },
    { source: "ENKI", target: "PROMPT_HOOKS", type: "flow" },
    { source: "PROMPT_HOOKS", target: "PULSE_ORCH", type: "flow" },
    { source: "PULSE_ORCH", target: "CLASSIFIER", type: "flow" },
    { source: "CLASSIFIER", target: "DEEPSEEK", type: "flow" },
    { source: "CLASSIFIER", target: "OPENCLAW", type: "flow" },
    { source: "CLASSIFIER", target: "HERMES_FC", type: "flow" },
    { source: "CLASSIFIER", target: "CASSANDRA", type: "flow" },
    { source: "CLASSIFIER", target: "SWARM", type: "flow" },
    { source: "CLASSIFIER", target: "OBLITERATUS", type: "flow" },
    { source: "DEEPSEEK", target: "PULSE_BUS", type: "data" },
    { source: "OPENCLAW", target: "PULSE_BUS", type: "advises" },
    { source: "HERMES_FC", target: "PULSE_BUS", type: "data" },
    { source: "CASSANDRA", target: "PULSE_BUS", type: "data" },
    { source: "SWARM", target: "PULSE_BUS", type: "data" },
    { source: "OBLITERATUS", target: "PULSE_BUS", type: "data" },
    { source: "PULSE_BUS", target: "ENKI_DECISION", type: "data" },
    { source: "ENKI_DECISION", target: "GATE_CODEX2", type: "gates" },
    { source: "ENKI_DECISION", target: "GATE_NEXUS", type: "gates" },
    { source: "ENKI_DECISION", target: "LANE_LOCAL", type: "flow" },
    { source: "ENKI_DECISION", target: "LANE_DSFLASH", type: "flow" },
    { source: "ENKI_DECISION", target: "LANE_MINI", type: "flow" },
    { source: "ENKI_DECISION", target: "LANE_CODEX", type: "flow" },
    { source: "GATE_CODEX2", target: "LANE_MINI", type: "gates" },
    { source: "GATE_CODEX2", target: "LANE_CODEX", type: "gates" },
    { source: "ENKI_DECISION", target: "MEM_HOT", type: "memory" },
    { source: "MEM_HOT", target: "MEM_WARM", type: "memory" },
    { source: "MEM_WARM", target: "MEM_COLD", type: "memory" },
    { source: "MEM_COLD", target: "MEM_KERNEL", type: "memory" },
    { source: "SVC_SHELL", target: "ENKI", type: "data" },
    { source: "SVC_RUNTIME", target: "ENKI", type: "data" },
    { source: "SVC_RAG", target: "MEM_COLD", type: "data" },
    { source: "SVC_EOT", target: "MEM_WARM", type: "data" },
    { source: "LANE_MINI", target: "RESPONSE", type: "flow" },
    { source: "LANE_CODEX", target: "RESPONSE", type: "flow" },
    { source: "LANE_LOCAL", target: "RESPONSE", type: "flow" },
    { source: "RESPONSE", target: "USER", type: "flow" }
  ];

  const nodeById = new Map(nodes.map((node) => [node.id, node]));
  const nodesByLayer = new Map();

  for (const node of nodes) {
    if (!nodesByLayer.has(node.layer)) nodesByLayer.set(node.layer, []);
    nodesByLayer.get(node.layer).push(node);
  }

  bottomBar.textContent = `TIER CRITICAL · PROTOCOL-CHANGE · ${nodes.length} NODES · ${links.length} EDGES`;

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const primaryGlow = new Set(["USER", "ENKI", "PULSE_ORCH", "ENKI_DECISION", "RESPONSE"]);
  let dpr = 1;
  let width = window.innerWidth;
  let canvasHeight = Math.max(1600, window.innerHeight);
  let hovered = null;
  let selected = null;
  let dashOffset = 0;
  const bootStarted = performance.now();

  for (const node of nodes) {
    node.x = width / 2;
    node.y = LAYER_Y[node.layer];
    node.vx = 0;
    node.vy = 0;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function hexToRgba(hex, alpha) {
    const value = hex.replace("#", "");
    const normalized = value.length === 3
      ? value.split("").map((char) => char + char).join("")
      : value;
    const parsed = Number.parseInt(normalized, 16);
    const r = (parsed >> 16) & 255;
    const g = (parsed >> 8) & 255;
    const b = parsed & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function targetXFor(node) {
    const layerNodes = nodesByLayer.get(node.layer) || [];
    const index = layerNodes.indexOf(node);
    const total = layerNodes.length;
    const spread = Math.min(total * 120, width * 0.8);
    const startX = (width - spread) / 2;
    return startX + (index / Math.max(total - 1, 1)) * spread;
  }

  function resize() {
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    width = window.innerWidth;
    canvasHeight = Math.max(1600, window.innerHeight);
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(canvasHeight * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${canvasHeight}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    simulation
      .force("center", d3.forceCenter(width / 2, canvasHeight / 2).strength(0.02))
      .force("x", d3.forceX((node) => targetXFor(node)).strength(0.3))
      .force("y", d3.forceY((node) => LAYER_Y[node.layer]).strength(0.9));
    simulation.alpha(0.9).restart();
  }

  const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id).distance(60).strength(0.05))
    .force("charge", d3.forceManyBody().strength(-800))
    .force("collide", d3.forceCollide((node) => node.r + 20))
    .force("y", d3.forceY((node) => LAYER_Y[node.layer]).strength(0.9))
    .force("x", d3.forceX((node) => targetXFor(node)).strength(0.3))
    .force("center", d3.forceCenter(width / 2, canvasHeight / 2).strength(0.02))
    .alphaDecay(0.015);

  function bootFade(delay, duration) {
    if (reducedMotion) return 1;
    return clamp((performance.now() - bootStarted - delay) / duration, 0, 1);
  }

  function edgeStyle(type) {
    return edgeStyles[type] || edgeStyles.flow;
  }

  function arrowhead(source, target, color, opacity) {
    const angle = Math.atan2(target.y - source.y, target.x - source.x);
    const endX = target.x - Math.cos(angle) * (target.r + 4);
    const endY = target.y - Math.sin(angle) * (target.r + 4);
    const size = 5;

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(endX, endY);
    ctx.lineTo(endX - Math.cos(angle - Math.PI / 6) * size, endY - Math.sin(angle - Math.PI / 6) * size);
    ctx.lineTo(endX - Math.cos(angle + Math.PI / 6) * size, endY - Math.sin(angle + Math.PI / 6) * size);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawEdges(now) {
    const edgeFade = bootFade(800, 400);
    dashOffset += reducedMotion ? 0 : 0.5;

    for (const link of links) {
      const source = link.source;
      const target = link.target;
      const style = edgeStyle(link.type);
      const relevant = !hovered || hovered === source || hovered === target || selected === source || selected === target;
      const opacity = style.opacity * edgeFade * (relevant ? 1 : 0.22);
      const angle = Math.atan2(target.y - source.y, target.x - source.x);
      const endX = target.x - Math.cos(angle) * (target.r + 8);
      const endY = target.y - Math.sin(angle) * (target.r + 8);

      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.strokeStyle = style.color;
      ctx.lineWidth = style.width;
      ctx.setLineDash(style.dash);
      ctx.lineDashOffset = link.type === "data" ? -dashOffset : 0;
      ctx.beginPath();
      ctx.moveTo(source.x, source.y);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      ctx.restore();

      arrowhead(source, target, style.color, opacity);
    }
  }

  function drawOpenClawCage(node) {
    ctx.save();
    ctx.strokeStyle = "#FF5252";
    ctx.lineWidth = 1.2;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.arc(node.x, node.y, node.r + 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawNode(node) {
    const isHovered = hovered === node;
    const isSelected = selected === node;
    const dimmed = hovered && !isHovered;
    const alpha = dimmed ? 0.24 : 1;
    const shadow = primaryGlow.has(node.id) ? 25 : 12;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowBlur = isHovered ? 40 : shadow;
    ctx.shadowColor = node.color;
    ctx.beginPath();
    ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba(node.color, 0.18);
    ctx.fill();
    ctx.lineWidth = isHovered ? 2.6 : 2;
    ctx.strokeStyle = node.color;
    ctx.stroke();
    ctx.restore();

    if (node.id === "OPENCLAW") drawOpenClawCage(node);

    if (isSelected) {
      ctx.save();
      ctx.strokeStyle = "rgba(0, 212, 255, 0.85)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.r + 13, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    const textAlpha = dimmed ? 0.28 : 1;
    ctx.save();
    ctx.globalAlpha = textAlpha;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#C8D8E8";
    ctx.font = "bold 13px JetBrains Mono, monospace";
    ctx.fillText(node.label, node.x, node.y - 8);

    ctx.fillStyle = "#5A7090";
    ctx.font = "11px JetBrains Mono, monospace";
    ctx.fillText(node.role, node.x, node.y + 8);

    if (node.r >= 36 && node.detail) {
      ctx.fillStyle = "#3A5070";
      ctx.font = "9px JetBrains Mono, monospace";
      ctx.fillText(node.detail, node.x, node.y + 22);
    }
    ctx.restore();

    if (node.r < 30) {
      ctx.save();
      ctx.globalAlpha = textAlpha;
      ctx.fillStyle = "#5A7090";
      ctx.font = "10px JetBrains Mono, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(node.id, node.x, node.y - node.r - 12);
      ctx.restore();
    }
  }

  function drawScene(now) {
    ctx.clearRect(0, 0, width, canvasHeight);
    drawEdges(now);
    for (const node of nodes) drawNode(node);
  }

  function frame(now) {
    drawScene(now);
    requestAnimationFrame(frame);
  }

  function findNode(x, y) {
    for (let index = nodes.length - 1; index >= 0; index -= 1) {
      const node = nodes[index];
      const dx = x - node.x;
      const dy = y - node.y;
      if (Math.sqrt(dx * dx + dy * dy) <= node.r) return node;
    }
    return null;
  }

  function moveTooltip(node, event) {
    if (!node) {
      tooltip.style.display = "none";
      return;
    }

    const left = clamp(event.clientX + 14, 8, Math.max(8, window.innerWidth - 340));
    const top = clamp(event.clientY + 14, 8, Math.max(8, window.innerHeight - 120));
    tooltip.innerHTML = `<strong>${node.id}</strong>\n${node.role}\n${node.detail}`;
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
    tooltip.style.display = "block";
  }

  function edgeEntry(edge) {
    const item = document.createElement("div");
    item.className = "drawer-item";

    const line = document.createElement("div");
    line.className = "drawer-line";

    const badge = document.createElement("span");
    badge.className = `badge ${edge.type}`;
    badge.textContent = edge.type;

    const text = document.createElement("span");
    text.textContent = `${edge.source.id} → ${edge.target.id}`;

    line.append(badge, text);
    item.append(line);
    return item;
  }

  function renderEdgeGroup(container, entries, emptyLabel) {
    container.innerHTML = "";
    if (entries.length === 0) {
      const empty = document.createElement("div");
      empty.className = "drawer-item";
      empty.textContent = emptyLabel;
      container.append(empty);
      return;
    }

    for (const edge of entries) {
      container.append(edgeEntry(edge));
    }
  }

  function openDrawer(node) {
    selected = node;
    drawerId.textContent = node.id;
    drawerRole.textContent = node.role;
    drawerDetail.textContent = node.detail;

    const incoming = links.filter((edge) => edge.target.id === node.id);
    const outgoing = links.filter((edge) => edge.source.id === node.id);

    renderEdgeGroup(drawerIncoming, incoming, "No incoming edges");
    renderEdgeGroup(drawerOutgoing, outgoing, "No outgoing edges");

    drawer.classList.add("open");
    drawerBackdrop.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
  }

  function closeDrawer() {
    selected = null;
    drawer.classList.remove("open");
    drawerBackdrop.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
  }

  canvas.addEventListener("mousemove", (event) => {
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    hovered = findNode(x, y);
    canvas.style.cursor = hovered ? "pointer" : "default";
    moveTooltip(hovered, event);
  });

  canvas.addEventListener("mouseleave", () => {
    hovered = null;
    canvas.style.cursor = "default";
    tooltip.style.display = "none";
  });

  canvas.addEventListener("click", (event) => {
    const rect = canvas.getBoundingClientRect();
    const node = findNode(event.clientX - rect.left, event.clientY - rect.top);
    if (node) openDrawer(node);
  });

  drawerBackdrop.addEventListener("click", closeDrawer);
  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeDrawer();
  });
  window.addEventListener("resize", resize);

  resize();
  requestAnimationFrame(frame);
})();
</script>
