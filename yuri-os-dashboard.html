html,

canvas {

.soak {

.alert-dot {

.legend-line {

}

.status-strip {
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);

  font-size: 10px;
  color: var(--text-dim);

  white-space: nowrap;
}

.view-controls {

  right: 24px;
  bottom: 24px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 8px;

.view-controls button {
  min-width: 72px;
  padding: 8px 14px;
  border: 1px solid rgba(0,212,255,0.25);
  border-radius: 4px;
  background: rgba(13,21,38,0.85);

  font-size: 10px;
  letter-spacing: 0.14em;
  text-align: center;
  cursor: pointer;

.view-controls button:hover,
.view-controls button:focus-visible {

  color: var(--cyan);
  background: rgba(0,212,255,0.08);
  outline: none;
}

.node-label {
  max-width: 240px;
  text-align: center;
  pointer-events: none;
  user-select: none;
  transform: translate(-50%, -50%);

.lbl-id {

  font-weight: 500;

  color: var(--text-bright);

.lbl-role {

.lbl-detail {

  font-size: 10px;
  line-height: 1.35;

.node-label.is-sub .lbl-role {

.node-label.expanded {

.node-label.expanded .lbl-role {
  color: var(--text);

}

.node-label.expanded .lbl-detail {

}

@keyframes alertBreath {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

@media (max-width: 760px) {
  .legend,

@media (prefers-reduced-motion: reduce) {
  .alert-dot {
    animation: none;
  }

function makeStarLayer(count, range, size, opacity) {
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * range;
    positions[i * 3 + 1] = (Math.random() - 0.5) * range;
    positions[i * 3 + 2] = (Math.random() - 0.5) * range;
  }
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xC8D8E8,
    size,
    transparent: true,
    opacity,
    sizeAttenuation: true,
    depthWrite: false
  });
  return new THREE.Points(geom, mat);
}

    void main(){
      float h = (vPos.y + 4000.0) / 8000.0;
      vec3 deep = vec3(0.004, 0.016, 0.086);
      vec3 mid  = vec3(0.000, 0.052, 0.130);
      vec3 high = vec3(0.027, 0.108, 0.218);
      vec3 col = mix(deep, mix(mid, high, smoothstep(0.5,1.0,h)), smoothstep(0.0,0.5,h));
      col += 0.018 * sin(vPos.x*0.001 + uTime*0.05) * sin(vPos.z*0.0015);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(nebulaGeom, nebulaMat));

function colorToHex(hex) {
  return new THREE.Color(hex);
}

function makeOrb(r, hex) {
  const group = new THREE.Group();
  const color = colorToHex(hex);

  const coreGeom = new THREE.SphereGeometry(r, 48, 48);
  const coreMat = new THREE.MeshPhysicalMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.85,
    metalness: 0.25,
    roughness: 0.35,
    clearcoat: 0.6,
    clearcoatRoughness: 0.3,
    transparent: false
  });
  const core = new THREE.Mesh(coreGeom, coreMat);
  group.add(core);

  const atmGeom = new THREE.SphereGeometry(r * 1.45, 32, 32);
  const atmMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.18,
    side: THREE.BackSide,
    depthWrite: false
  });
  group.add(new THREE.Mesh(atmGeom, atmMat));

  const farGeom = new THREE.SphereGeometry(r * 2.2, 24, 24);
  const farMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.05,
    side: THREE.BackSide,
    depthWrite: false
  });
  group.add(new THREE.Mesh(farGeom, farMat));

  group.userData.core = core;
  return group;
}

function makeLabel(node) {
  const labelDiv = document.createElement('div');
  labelDiv.className = `node-label ${node.tier === 'sub' ? 'is-sub' : 'is-section'}`;
  labelDiv.innerHTML = `<div class="lbl-id">${node.id}</div><div class="lbl-role">${node.role}</div><div class="lbl-detail">${node.detail || node.label}</div>`;
  const label = new CSS2DObject(labelDiv);
  label.position.set(0, -(node.r + 28), 0);
  return { label, labelDiv };
}

function addOpenClawRing(node, group) {
  if (node.id !== 'OPENCLAW_A') return;
  const ringGeom = new THREE.RingGeometry(node.r + 8, node.r + 10.5, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xFF5252,
    transparent: true,
    opacity: 0.58,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeom, ringMat);
  ring.rotation.x = Math.PI / 2;
  group.add(ring);
  group.userData.cageRing = ring;
}

function addHoverRing(node, group) {
  const ringGeom = new THREE.RingGeometry(node.r * 1.65, node.r * 1.72, 96);
  const ringMat = new THREE.MeshBasicMaterial({
    color: colorToHex(node.color),
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeom, ringMat);
  ring.rotation.x = Math.PI / 2;
  group.add(ring);
  group.userData.hoverRing = ring;
}

function positionSubNodes(nodesForStage, stage) {
  const radius = 220;
  const arc = Math.PI * 0.85;
  nodesForStage.forEach((node, i) => {
    const t = nodesForStage.length === 1 ? 0 : (i / (nodesForStage.length - 1)) - 0.5;
    const angle = stage.twist + t * arc;
    node.position = new THREE.Vector3(radius * Math.cos(angle), stage.y - 70, radius * Math.sin(angle));
  });
}

const nodes = [];
const nodeById = new Map();
const raycastMeshes = [];

sections.forEach(node => {
  const stage = stageById.get(node.id);
  node.position = new THREE.Vector3(0, stage.y, 0);
});

for (const stage of STAGES) {
  const childNodes = subs.filter(node => node.parent === stage.id);
  positionSubNodes(childNodes, stage);
}

[...sections, ...subs].forEach(node => {
  const group = makeOrb(node.r, node.color);
  group.position.copy(node.position);
  const { label, labelDiv } = makeLabel(node);
  group.add(label);
  addOpenClawRing(node, group);
  addHoverRing(node, group);
  scene.add(group);

  const core = group.userData.core;
  core.userData.nodeId = node.id;
  raycastMeshes.push(core);

  const record = {
    ...node,
    group,
    labelDiv,
    core,
    origPos: node.position.clone(),
    breathPhase: Math.random() * Math.PI * 2,
    hoverScale: 1,
    pulseBoost: 0
  };
  nodes.push(record);
  nodeById.set(node.id, record);
});

function arcCurve(start, end, archHeight, archDir) {
  const mid = start.clone().add(end).multiplyScalar(0.5);
  const offsetVec = archDir.clone().normalize().multiplyScalar(archHeight);
  const apex = mid.clone().add(offsetVec);
  return new THREE.QuadraticBezierCurve3(start, apex, end);
}

function makeBezier(start, end, type) {
  const deltaY = end.y - start.y;
  if (type === 'gates') {
    return arcCurve(start, end, 180, new THREE.Vector3(1, 0.15, 0.35));
  }
  if (start.distanceTo(end) > 1400 || start.y < end.y - 900) {
    return arcCurve(start, end, 520, new THREE.Vector3(-1, 0.25, 0.55));
  }
  if (Math.abs(start.x - end.x) < 1 && Math.abs(start.z - end.z) < 1) {
    return new THREE.CubicBezierCurve3(
      start,
      new THREE.Vector3(start.x, start.y + deltaY * 0.45, start.z + 42),
      new THREE.Vector3(end.x, end.y - deltaY * 0.45, end.z - 42),
      end
    );
  }
  const lift = type === 'data' || type === 'memory' || type === 'advises' ? 170 : 90;
  return new THREE.CubicBezierCurve3(
    start,
    new THREE.Vector3(start.x * 0.72, start.y + deltaY * 0.3, start.z + lift),
    new THREE.Vector3(end.x * 0.72, end.y - deltaY * 0.3, end.z + lift),
    end
  );
}

const edgeColorByType = {
  flow: 0x00D4FF,
  branch: 0x4A9EFF,
  data: 0x4A9EFF,
  advises: 0x9B6EFF,
  gates: 0xFF6835,
  memory: 0x74B9FF
};

const edgeOpacityByType = {
  flow: 0.85,
  branch: 0.45,
  data: 0.55,
  advises: 0.35,
  gates: 0.65,
  memory: 0.30
};

const edgeWeightByType = {
  flow: 1.5,
  branch: 0.6,
  data: 0.7,
  advises: 0.5,
  gates: 1.0,
  memory: 0.4
};

const edgeGroup = new THREE.Group();
scene.add(edgeGroup);
const edges = [];
const edgesByPair = new Map();
const adjacency = new Map();

function addEdge(source, target, type) {
  const startNode = nodeById.get(source);
  const endNode = nodeById.get(target);
  if (!startNode || !endNode) return;

  const curve = makeBezier(startNode.origPos, endNode.origPos, type);
  const tubeGeom = new THREE.TubeGeometry(curve, 64, edgeWeightByType[type], 8, false);
  const tubeMat = new THREE.MeshBasicMaterial({
    color: edgeColorByType[type],
    transparent: true,
    opacity: edgeOpacityByType[type],
    depthWrite: false
  });
  const mesh = new THREE.Mesh(tubeGeom, tubeMat);
  edgeGroup.add(mesh);

  const edge = { source, target, type, curve, mesh };
  edges.push(edge);
  edgesByPair.set(`${source}->${target}`, edge);
  if (!adjacency.has(source)) adjacency.set(source, []);
  adjacency.get(source).push(target);
}

const edgeOrder = { memory: 0, advises: 1, data: 2, branch: 3, gates: 4, flow: 5 };
edgeSpecs
  .sort((a, b) => edgeOrder[a[2]] - edgeOrder[b[2]])
  .forEach(([source, target, type]) => addEdge(source, target, type));

class Pulse {
  constructor(path) {
    this.path = path;
    this.segment = 0;
    this.t = 0;
    this.trail = [];

    const geom = new THREE.SphereGeometry(4, 16, 16);
    const mat = new THREE.MeshBasicMaterial({
      color: 0x00FFFF,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.mesh = new THREE.Mesh(geom, mat);
    scene.add(this.mesh);

    for (let i = 0; i < 5; i++) {
      const trailMat = mat.clone();
      trailMat.opacity = 0.38 - i * 0.06;
      const trailOrb = new THREE.Mesh(new THREE.SphereGeometry(3.2 - i * 0.32, 12, 12), trailMat);
      scene.add(trailOrb);
      this.trail.push(trailOrb);
    }
  }

  update(dt) {
    this.t += dt / 0.6;
    if (this.t >= 1) {
      const targetId = this.path[this.segment + 1];
      const node = nodeById.get(targetId);
      if (node) node.pulseBoost = 0.6;
      this.segment += 1;
      this.t = 0;
    }
    if (this.segment >= this.path.length - 1) {
      this.dispose();
      return false;
    }

    const pair = `${this.path[this.segment]}->${this.path[this.segment + 1]}`;
    const edge = edgesByPair.get(pair);
    if (!edge) {
      this.dispose();
      return false;
    }

    const pos = edge.curve.getPointAt(Math.min(this.t, 1));
    this.mesh.position.copy(pos);
    this.trail.forEach((trailOrb, index) => {
      const lagT = Math.max(0, this.t - (index + 1) * 0.045);
      trailOrb.position.copy(edge.curve.getPointAt(lagT));
      trailOrb.material.opacity = Math.max(0, 0.38 - index * 0.06 - (this.t > 0.88 ? (this.t - 0.88) * 2 : 0));
    });
    return true;
  }

  dispose() {
    scene.remove(this.mesh);
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();
    this.trail.forEach(trailOrb => {
      scene.remove(trailOrb);
      trailOrb.geometry.dispose();
      trailOrb.material.dispose();
    });
  }
}

const activePulses = [];
const weightedStarts = ['USER', 'USER', 'USER_INPUT', 'USER_INPUT', 'ENKI', 'ENKI', 'SESSION_INIT', 'PROMPT_HOOKS', 'NEXUSPULSE', 'CLASSIFIER'];

function randomPath() {
  let current = weightedStarts[Math.floor(Math.random() * weightedStarts.length)];
  const path = [current];
  const steps = 3 + Math.floor(Math.random() * 5);
  for (let i = 0; i < steps; i++) {
    const nextNodes = adjacency.get(current);
    if (!nextNodes || nextNodes.length === 0) break;
    current = nextNodes[Math.floor(Math.random() * nextNodes.length)];
    path.push(current);
  }
  return path.length > 1 ? path : ['USER', 'USER_INPUT', 'ENKI'];
}

let pulseTimer = 0;
function maybeSpawnPulse(dt) {
  if (reduceMotion) return;
  pulseTimer += dt;
  if (pulseTimer >= 2.5) {
    pulseTimer = 0;
    if (activePulses.length < 4) {
      activePulses.push(new Pulse(randomPath()));
    }
  }
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-2, -2);
let hovered = null;

window.addEventListener('pointermove', event => {
  pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
});

window.addEventListener('pointerleave', () => {
  pointer.set(-2, -2);
  setHovered(null);
});

function setHovered(node) {
  if (hovered === node) return;
  if (hovered) hovered.labelDiv.classList.remove('expanded');
  hovered = node;
  if (hovered) hovered.labelDiv.classList.add('expanded');
}

function updateRaycast() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(raycastMeshes, false);
  const hit = hits.length ? nodeById.get(hits[0].object.userData.nodeId) : null;
  setHovered(hit || null);
}

function updateHoverPhysics(time) {
  nodes.forEach(node => {
    const targetHoverScale = node === hovered ? 1.45 : 1.0;
    node.hoverScale += (targetHoverScale - node.hoverScale) * 0.15;

    let tx = node.origPos.x;
    let ty = node.origPos.y;
    let tz = node.origPos.z;
    if (hovered && node !== hovered) {
      const delta = node.origPos.clone().sub(hovered.origPos);
      const d = delta.length();
      if (d < 350 && d > 0) {
        const push = (350 - d) * 0.08;
        delta.normalize();
        tx += delta.x * push;
        ty += delta.y * push;
        tz += delta.z * push;
      }
    }

    node.group.position.x += (tx - node.group.position.x) * 0.15;
    node.group.position.y += (ty - node.group.position.y) * 0.15;
    node.group.position.z += (tz - node.group.position.z) * 0.15;

    const breath = reduceMotion ? 1 : 1.0 + Math.sin(time * 0.0008 + node.breathPhase) * 0.025;
    const finalScale = node.hoverScale * breath;
    node.group.scale.setScalar(finalScale);

    node.pulseBoost += (0 - node.pulseBoost) * 0.08;
    node.core.material.emissiveIntensity += ((node === hovered ? 1.4 : 0.85) + node.pulseBoost - node.core.material.emissiveIntensity) * 0.18;
    node.group.userData.hoverRing.material.opacity += ((node === hovered ? 0.55 : 0) - node.group.userData.hoverRing.material.opacity) * 0.16;
    if (node.group.userData.cageRing) {
      node.group.userData.cageRing.rotation.y += reduceMotion ? 0 : 0.008;
    }
  });
}

const views = {
  FRONT: { pos: [0, -200, 2200], target: [0, -200, 0] },
  BACK: { pos: [0, -200, -2200], target: [0, -200, 0] },
  TOP: { pos: [0, 2400, 0], target: [0, 0, 0] },
  SIDE: { pos: [2200, -200, 0], target: [0, -200, 0] }
};

function animateToView(v) {
  const start = {
    px: camera.position.x,
    py: camera.position.y,
    pz: camera.position.z,
    tx: controls.target.x,
    ty: controls.target.y,
    tz: controls.target.z
  };
  const end = {
    px: v.pos[0],
    py: v.pos[1],
    pz: v.pos[2],
    tx: v.target[0],
    ty: v.target[1],
    tz: v.target[2]
  };
  const startTime = performance.now();
  function tick() {
    const t = Math.min(1, (performance.now() - startTime) / (reduceMotion ? 1 : 1200));
    const e = 0.5 - 0.5 * Math.cos(Math.PI * t);
    camera.position.set(
      start.px + (end.px - start.px) * e,
      start.py + (end.py - start.py) * e,
      start.pz + (end.pz - start.pz) * e
    );
    controls.target.set(
      start.tx + (end.tx - start.tx) * e,
      start.ty + (end.ty - start.ty) * e,
      start.tz + (end.tz - start.tz) * e
    );
    controls.update();
    if (t < 1) requestAnimationFrame(tick);
  }
  tick();
}

document.querySelectorAll('[data-view]').forEach(button => {
  button.addEventListener('click', () => animateToView(views[button.dataset.view]));
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate(time) {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  controls.update();
  updateRaycast();
  updateHoverPhysics(time);
  maybeSpawnPulse(dt);

  for (let i = activePulses.length - 1; i >= 0; i--) {
    if (!activePulses[i].update(dt)) activePulses.splice(i, 1);
  }

  nebulaMat.uniforms.uTime.value = time * 0.001;
  composer.render();
  labelRenderer.render(scene, camera);
}

animate(0);
</script>
